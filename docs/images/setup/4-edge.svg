<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <g id="head">
      <rect x="-20" y="-100" width="70" height="66" rx="8" fill="#37474f"/>
      <rect x="-62" y="-80" width="42" height="8" fill="#ef6c00"/>
      <rect x="-62" y="-80" width="8" height="70" fill="#ef6c00"/>
      <rect x="-12" y="-34" width="24" height="14" rx="2" fill="#b0bec5"/>
      <polygon points="-7,-20 7,-20 1.5,0 -1.5,0" fill="#c9a227"/>
    </g>
  </defs>
  <title>Step 4: edge check</title>
  <rect width="900" height="340" rx="14" fill="#ffffff"/>
  <rect x="20" y="20" width="410" height="250" rx="10" fill="#1e2428"/>
  <rect x="20" y="20" width="410" height="44" rx="10" fill="#2b3338"/>
  <rect x="20" y="50" width="410" height="14" fill="#2b3338"/>
  <text x="36" y="48" font-size="14" fill="#ffffff" font-weight="600" text-anchor="start">Auto-eject setup - 4 of 5 - edge check</text>
  <text x="408" y="48" font-size="14" fill="#90a4ae" font-weight="normal" text-anchor="start">x</text>
  <text x="36" y="90" font-size="13" fill="#cfd8dc" font-weight="normal" text-anchor="start">Look at the blade from the side. Is it past the edge</text>
  <text x="36" y="109" font-size="13" fill="#cfd8dc" font-weight="normal" text-anchor="start">of the sheet?</text>
  <rect x="36" y="134" width="378" height="34" rx="6" fill="#1e88e5"/>
  <rect x="33" y="131" width="384" height="40" rx="8" fill="none" stroke="#ef6c00" stroke-width="3"/>
  <text x="225.0" y="156" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">YES, IT IS PAST THE EDGE</text>
  <rect x="36" y="178" width="378" height="34" rx="6" fill="#fb8c00"/>
  <text x="225.0" y="200" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">NO</text>
  <text x="410" y="244" font-size="12" fill="#90a4ae" font-weight="600" text-anchor="end">CANCEL</text>
  <circle cx="426" cy="24" r="17" fill="#ef6c00"/>
  <text x="426" y="30" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <rect x="470" y="30" width="200" height="220" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="530" y="200" width="130" height="10" fill="#90a4ae"/>
  <rect x="545" y="197" width="115" height="3" fill="#4fc3f7"/>
  <use href="#head" transform="translate(590,190)"/>
  <circle cx="500" cy="60" r="15" fill="#2e7d32"/>
  <path d="M493,60 l5,5 l9,-10" stroke="#fff" stroke-width="3" fill="none"/>
  <line x1="545" y1="215" x2="545" y2="235" stroke="#57606a" stroke-dasharray="3 3"/>
  <text x="545" y="245" font-size="11" fill="#57606a" font-weight="normal" text-anchor="middle">sheet edge</text>
  <rect x="690" y="30" width="200" height="220" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="750" y="200" width="130" height="10" fill="#90a4ae"/>
  <rect x="765" y="197" width="115" height="3" fill="#4fc3f7"/>
  <use href="#head" transform="translate(840,190)"/>
  <circle cx="720" cy="60" r="15" fill="#c62828"/>
  <path d="M714,54 l12,12 M726,54 l-12,12" stroke="#fff" stroke-width="3"/>
  <line x1="765" y1="215" x2="765" y2="235" stroke="#57606a" stroke-dasharray="3 3"/>
  <text x="765" y="245" font-size="11" fill="#57606a" font-weight="normal" text-anchor="middle">sheet edge</text>
  <text x="470" y="280" font-size="14" fill="#24292f" font-weight="normal" text-anchor="start">Left: good, the blade face is past the edge.</text>
  <text x="470" y="300" font-size="14" fill="#24292f" font-weight="normal" text-anchor="start">Right: the blade stops short, parts would stay on the bed.</text>

</svg>
