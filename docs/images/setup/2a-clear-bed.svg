<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <g id="head">
      <rect x="-20" y="-100" width="70" height="66" rx="8" fill="#37474f"/>
      <rect x="-62" y="-80" width="42" height="8" fill="#ef6c00"/>
      <rect x="-62" y="-80" width="8" height="70" fill="#ef6c00"/>
      <rect x="-12" y="-34" width="24" height="14" rx="2" fill="#b0bec5"/>
      <polygon points="-7,-20 7,-20 1.5,0 -1.5,0" fill="#c9a227"/>
    </g>
  </defs>
  <title>Step 2a: clear the bed</title>
  <rect width="900" height="340" rx="14" fill="#ffffff"/>
  <rect x="20" y="20" width="410" height="225" rx="10" fill="#1e2428"/>
  <rect x="20" y="20" width="410" height="44" rx="10" fill="#2b3338"/>
  <rect x="20" y="50" width="410" height="14" fill="#2b3338"/>
  <text x="36" y="48" font-size="14" fill="#ffffff" font-weight="600" text-anchor="start">Auto-eject setup - 2 of 5 - measure the blade</text>
  <text x="408" y="48" font-size="14" fill="#90a4ae" font-weight="normal" text-anchor="start">x</text>
  <text x="36" y="90" font-size="13" fill="#cfd8dc" font-weight="normal" text-anchor="start">Clear the bed, but leave a printed calibration block</text>
  <text x="36" y="109" font-size="13" fill="#cfd8dc" font-weight="normal" text-anchor="start">where it is. The toolhead goes to it, or to the</text>
  <text x="36" y="128" font-size="13" fill="#cfd8dc" font-weight="normal" text-anchor="start">middle of the bed.</text>
  <rect x="36" y="153" width="378" height="34" rx="6" fill="#1e88e5"/>
  <rect x="33" y="150" width="384" height="40" rx="8" fill="none" stroke="#ef6c00" stroke-width="3"/>
  <text x="225.0" y="175" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">BED IS CLEAR - MOVE</text>
  <text x="410" y="219" font-size="12" fill="#90a4ae" font-weight="600" text-anchor="end">CANCEL</text>
  <circle cx="426" cy="24" r="17" fill="#ef6c00"/>
  <text x="426" y="30" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <rect x="520" y="40" width="240" height="200" rx="8" fill="#90a4ae"/>
  <rect x="530" y="50" width="220" height="180" rx="4" fill="#4fc3f7"/>
  <text x="510" y="234" font-size="12" fill="#57606a" font-weight="700" text-anchor="end">FRONT</text>
  <rect x="680" y="85" width="26" height="26" rx="2" fill="#9e9e9e" stroke="#616161"/>
  <text x="693" y="128" font-size="12" fill="#24292f" font-weight="600" text-anchor="middle">block</text>
  <circle cx="545" cy="215" r="14" fill="#37474f"/>
  <path d="M556,204 Q610,150 672,104" stroke="#1565c0" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#ab)"/>
  <text x="560" y="140" font-size="13" fill="#24292f" font-weight="600" text-anchor="start">Z 50 mm</text>
  <text x="470" y="296" font-size="14" fill="#24292f" font-weight="normal" text-anchor="start">Take everything else off the bed.</text>
  <text x="470" y="316" font-size="14" fill="#24292f" font-weight="normal" text-anchor="start">The toolhead homes around the block and stops 5 cm above it.</text>

</svg>
