<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <g id="head">
      <rect x="-20" y="-100" width="70" height="66" rx="8" fill="#37474f"/>
      <rect x="-62" y="-80" width="42" height="8" fill="#ef6c00"/>
      <rect x="-62" y="-80" width="8" height="70" fill="#ef6c00"/>
      <rect x="-12" y="-34" width="24" height="14" rx="2" fill="#b0bec5"/>
      <polygon points="-7,-20 7,-20 1.5,0 -1.5,0" fill="#c9a227"/>
    </g>
  </defs>
  <title>Step 5: save</title>
  <rect width="900" height="372" rx="14" fill="#ffffff"/>
  <rect x="20" y="20" width="410" height="332" rx="10" fill="#1e2428"/>
  <rect x="20" y="20" width="410" height="44" rx="10" fill="#2b3338"/>
  <rect x="20" y="50" width="410" height="14" fill="#2b3338"/>
  <text x="36" y="48" font-size="14" fill="#ffffff" font-weight="600" text-anchor="start">Auto-eject setup - 5 of 5 - save</text>
  <text x="408" y="48" font-size="14" fill="#90a4ae" font-weight="normal" text-anchor="start">x</text>
  <text x="36" y="90" font-size="13" fill="#cfd8dc" font-weight="normal" text-anchor="start">Drop edge: front. Blade: 100 mm wide, 54 mm ahead of</text>
  <text x="36" y="109" font-size="13" fill="#cfd8dc" font-weight="normal" text-anchor="start">the nozzle, pushes at Z 0.50.</text>
  <text x="36" y="128" font-size="13" fill="#cfd8dc" font-weight="normal" text-anchor="start"></text>
  <text x="36" y="147" font-size="13" fill="#cfd8dc" font-weight="normal" text-anchor="start">Start pushing when the bed is below: 32 C</text>
  <rect x="36" y="172" width="88" height="34" rx="6" fill="#455a64"/>
  <text x="80.25" y="194" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">25 C</text>
  <rect x="132" y="172" width="88" height="34" rx="6" fill="#455a64"/>
  <text x="176.75" y="194" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">28 C</text>
  <rect x="229" y="172" width="88" height="34" rx="6" fill="#455a64"/>
  <text x="273.25" y="194" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">32 C</text>
  <rect x="326" y="172" width="88" height="34" rx="6" fill="#455a64"/>
  <text x="369.75" y="194" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">35 C</text>
  <rect x="36" y="216" width="378" height="34" rx="6" fill="#1e88e5"/>
  <rect x="33" y="213" width="384" height="40" rx="8" fill="none" stroke="#ef6c00" stroke-width="3"/>
  <text x="225.0" y="238" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">SAVE</text>
  <rect x="36" y="260" width="378" height="34" rx="6" fill="#455a64"/>
  <text x="225.0" y="282" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">START OVER</text>
  <text x="410" y="326" font-size="12" fill="#90a4ae" font-weight="600" text-anchor="end">CANCEL</text>
  <circle cx="426" cy="24" r="17" fill="#ef6c00"/>
  <text x="426" y="30" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
  <rect x="520" y="60" width="26" height="150" rx="13" fill="#eceff1" stroke="#57606a"/>
  <rect x="526" y="120" width="14" height="86" rx="7" fill="#c62828"/>
  <circle cx="533" cy="220" r="20" fill="#c62828"/>
  <text x="570" y="120" font-size="15" fill="#24292f" font-weight="600" text-anchor="start">Pick when the parts let go.</text>
  <text x="570" y="148" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">32 C is a good start for PLA.</text>
  <text x="570" y="168" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Then press SAVE, and DRY TEST</text>
  <text x="570" y="188" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">to watch the path 2 cm above the bed.</text>

</svg>
