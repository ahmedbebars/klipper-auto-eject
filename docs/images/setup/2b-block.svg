<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 347" width="900" height="347" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <g id="head">
      <rect x="-20" y="-100" width="70" height="66" rx="8" fill="#37474f"/>
      <rect x="-62" y="-80" width="42" height="8" fill="#ef6c00"/>
      <rect x="-62" y="-80" width="8" height="70" fill="#ef6c00"/>
      <rect x="-12" y="-34" width="24" height="14" rx="2" fill="#b0bec5"/>
      <polygon points="-7,-20 7,-20 1.5,0 -1.5,0" fill="#c9a227"/>
    </g>
  </defs>
  <title>Step 2b: block under the nozzle</title>
  <rect width="900" height="347" rx="14" fill="#ffffff"/>
  <rect x="20" y="20" width="410" height="307" rx="10" fill="#1e2428"/>
  <rect x="20" y="20" width="410" height="44" rx="10" fill="#2b3338"/>
  <rect x="20" y="50" width="410" height="14" fill="#2b3338"/>
  <text x="36" y="48" font-size="14" fill="#ffffff" font-weight="600" text-anchor="start">Auto-eject setup - 2 of 5 - measure the blade</text>
  <text x="408" y="48" font-size="14" fill="#90a4ae" font-weight="normal" text-anchor="start">x</text>
  <text x="36" y="90" font-size="13" fill="#cfd8dc" font-weight="normal" text-anchor="start">The nozzle is above the calibration block you</text>
  <text x="36" y="109" font-size="13" fill="#cfd8dc" font-weight="normal" text-anchor="start">printed. Leave it stuck to the bed.</text>
  <text x="36" y="128" font-size="13" fill="#cfd8dc" font-weight="normal" text-anchor="start"></text>
  <text x="36" y="147" font-size="13" fill="#cfd8dc" font-weight="normal" text-anchor="start">Press Measure. The probe touches the block about 25</text>
  <text x="36" y="166" font-size="13" fill="#cfd8dc" font-weight="normal" text-anchor="start">times (2-3 minutes).</text>
  <rect x="36" y="191" width="378" height="34" rx="6" fill="#1e88e5"/>
  <rect x="33" y="188" width="384" height="40" rx="8" fill="none" stroke="#ef6c00" stroke-width="3"/>
  <text x="225.0" y="213" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">MEASURE</text>
  <rect x="36" y="235" width="378" height="34" rx="6" fill="#455a64"/>
  <text x="225.0" y="257" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">MEASURE BY HAND</text>
  <text x="410" y="301" font-size="12" fill="#90a4ae" font-weight="600" text-anchor="end">CANCEL</text>
  <circle cx="426" cy="24" r="17" fill="#ef6c00"/>
  <text x="426" y="30" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <rect x="470" y="270" width="410" height="10" fill="#90a4ae"/>
  <rect x="470" y="267" width="410" height="3" fill="#4fc3f7"/>
  <rect x="650" y="252" width="80" height="15" fill="#9e9e9e"/>
  <text x="690" y="290" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">printed block, 3.5 mm</text>
  <use href="#head" transform="translate(690,160)"/>
  <line x1="690" y1="167" x2="690" y2="245" stroke="#1565c0" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ab)"/>
  <line x1="745" y1="114" x2="745" y2="252" stroke="#ef6c00" stroke-dasharray="3 3"/>
  <text x="752" y="200" font-size="12" fill="#ef6c00" font-weight="600" text-anchor="start">the fan duct stays</text>
  <text x="752" y="216" font-size="12" fill="#ef6c00" font-weight="600" text-anchor="start">above a low block</text>
  <text x="470" y="316" font-size="14" fill="#24292f" font-weight="normal" text-anchor="start">Press MEASURE and keep your hands off the printer.</text>

</svg>
