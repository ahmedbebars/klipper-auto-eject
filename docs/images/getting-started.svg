<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 378" width="950" height="378" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Getting started: eight steps from a new blade to printing in a row</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
  <rect width="950" height="378" rx="12" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#24292f">Getting started, step by step</text>
  <text x="926" y="34" font-size="12" fill="#57606a" text-anchor="end">about one afternoon, most of it printing</text>
  <g transform="translate(24,60)">
    <rect width="205" height="112" rx="10" fill="#eef4fb" stroke="#1565c0"/>
    <circle cx="24" cy="24" r="13" fill="#1565c0"/>
    <text x="24" y="28.5" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">1</text>
    <text x="46" y="29" font-size="14" font-weight="600" fill="#0d47a1">Check your bed</text>
    <text x="14" y="60" font-size="12" fill="#57606a">a cooled part must slide</text>
    <text x="14" y="76" font-size="12" fill="#57606a">off with a finger push</text>
    <rect x="14" y="86" width="49" height="18" rx="9" fill="#ffffff" stroke="#1565c0" stroke-opacity="0.35"/>
    <text x="21" y="99" font-size="11" fill="#0d47a1">5 min</text>
  </g>
  <g transform="translate(255,60)">
    <rect width="205" height="112" rx="10" fill="#eef4fb" stroke="#1565c0"/>
    <circle cx="24" cy="24" r="13" fill="#1565c0"/>
    <text x="24" y="28.5" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">2</text>
    <text x="46" y="29" font-size="14" font-weight="600" fill="#0d47a1">Print the blade</text>
    <text x="14" y="60" font-size="12" fill="#57606a">blade, arm and mount,</text>
    <text x="14" y="76" font-size="12" fill="#57606a">in PETG, ABS or ASA</text>
    <rect x="14" y="86" width="77" height="18" rx="9" fill="#ffffff" stroke="#1565c0" stroke-opacity="0.35"/>
    <text x="21" y="99" font-size="11" fill="#0d47a1">about 3 h</text>
  </g>
  <g transform="translate(486,60)">
    <rect width="205" height="112" rx="10" fill="#eef4fb" stroke="#1565c0"/>
    <circle cx="24" cy="24" r="13" fill="#1565c0"/>
    <text x="24" y="28.5" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">3</text>
    <text x="46" y="29" font-size="14" font-weight="600" fill="#0d47a1">Mount it</text>
    <text x="14" y="60" font-size="12" fill="#57606a">two screws on the toolhead,</text>
    <text x="14" y="76" font-size="12" fill="#57606a">height set with a gauge</text>
    <rect x="14" y="86" width="56" height="18" rx="9" fill="#ffffff" stroke="#1565c0" stroke-opacity="0.35"/>
    <text x="21" y="99" font-size="11" fill="#0d47a1">15 min</text>
  </g>
  <g transform="translate(717,60)">
    <rect width="205" height="112" rx="10" fill="#eef4fb" stroke="#1565c0"/>
    <circle cx="24" cy="24" r="13" fill="#1565c0"/>
    <text x="24" y="28.5" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">4</text>
    <text x="46" y="29" font-size="14" font-weight="600" fill="#0d47a1">Install</text>
    <text x="14" y="60" font-size="12" fill="#57606a">one command over SSH,</text>
    <text x="14" y="76" font-size="12" fill="#57606a">then restart Klipper</text>
    <rect x="14" y="86" width="49" height="18" rx="9" fill="#ffffff" stroke="#1565c0" stroke-opacity="0.35"/>
    <text x="21" y="99" font-size="11" fill="#0d47a1">5 min</text>
  </g>
  <g transform="translate(717,220)">
    <rect width="205" height="112" rx="10" fill="#eef4fb" stroke="#1565c0"/>
    <circle cx="24" cy="24" r="13" fill="#1565c0"/>
    <text x="24" y="28.5" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">5</text>
    <text x="46" y="29" font-size="14" font-weight="600" fill="#0d47a1">Guided setup</text>
    <text x="14" y="60" font-size="12" fill="#57606a">five dialogs in Mainsail</text>
    <text x="14" y="76" font-size="12" fill="#57606a">or Fluidd, no ruler</text>
    <rect x="14" y="86" width="56" height="18" rx="9" fill="#ffffff" stroke="#1565c0" stroke-opacity="0.35"/>
    <text x="21" y="99" font-size="11" fill="#0d47a1">10 min</text>
  </g>
  <g transform="translate(486,220)">
    <rect width="205" height="112" rx="10" fill="#eef4fb" stroke="#1565c0"/>
    <circle cx="24" cy="24" r="13" fill="#1565c0"/>
    <text x="24" y="28.5" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">6</text>
    <text x="46" y="29" font-size="14" font-weight="600" fill="#0d47a1">Watch a test</text>
    <text x="14" y="60" font-size="12" fill="#57606a">print 2-3 test cubes,</text>
    <text x="14" y="76" font-size="12" fill="#57606a">eject them while you watch</text>
    <rect x="14" y="86" width="56" height="18" rx="9" fill="#ffffff" stroke="#1565c0" stroke-opacity="0.35"/>
    <text x="21" y="99" font-size="11" fill="#0d47a1">30 min</text>
  </g>
  <g transform="translate(255,220)">
    <rect width="205" height="112" rx="10" fill="#eef4fb" stroke="#1565c0"/>
    <circle cx="24" cy="24" r="13" fill="#1565c0"/>
    <text x="24" y="28.5" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">7</text>
    <text x="46" y="29" font-size="14" font-weight="600" fill="#0d47a1">Slicer</text>
    <text x="14" y="60" font-size="12" fill="#57606a">labels on, AUTO_EJECT</text>
    <text x="14" y="76" font-size="12" fill="#57606a">in the end G-code</text>
    <rect x="14" y="86" width="49" height="18" rx="9" fill="#ffffff" stroke="#1565c0" stroke-opacity="0.35"/>
    <text x="21" y="99" font-size="11" fill="#0d47a1">5 min</text>
  </g>
  <g transform="translate(24,220)">
    <rect width="205" height="112" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
    <circle cx="24" cy="24" r="13" fill="#2e7d32"/>
    <text x="24" y="28.5" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">8</text>
    <text x="46" y="29" font-size="14" font-weight="600" fill="#1b5e20">Print in a row</text>
    <text x="14" y="60" font-size="12" fill="#57606a">queue jobs: the printer</text>
    <text x="14" y="76" font-size="12" fill="#57606a">clears the bed itself</text>
    <rect x="14" y="86" width="42" height="18" rx="9" fill="#ffffff" stroke="#2e7d32" stroke-opacity="0.35"/>
    <text x="21" y="99" font-size="11" fill="#1b5e20">done</text>
  </g>
  <line x1="232" y1="116" x2="251" y2="116" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="463" y1="116" x2="482" y2="116" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="694" y1="116" x2="713" y2="116" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M819 175 V 216" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <line x1="714" y1="276" x2="695" y2="276" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="483" y1="276" x2="464" y2="276" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="252" y1="276" x2="233" y2="276" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="24" y="364" font-size="12" fill="#57606a">Optional afterwards: the web page (install.sh --web) for a live bed map, the queue and the settings in the browser.</text>
</svg>
