# klipper-auto-eject - user settings
# https://github.com/ahmedbebars/klipper-auto-eject
#
# Copy this file next to your printer.cfg and edit it for your machine.
# The installer never overwrites an existing copy.
# Full reference: docs/configuration.md

[gcode_macro _AUTO_EJECT_SETTINGS]
description: klipper-auto-eject settings (not meant to be called)

# ---------------------------------------------------------------------------
# On or off
# ---------------------------------------------------------------------------
# Push the parts off when a print ends. Off (False): AUTO_EJECT in the end
# G-code leaves them on the bed with a dialog, and the job queue waits for
# you (thin_pause_queue). Nothing is pushed then, not even by hand, and
# AUTO_EJECT_GUARD does not check the bed. A print that ends without an
# eject opens no dialog. A dry run still works. The web page's Overview has
# a switch.
variable_enabled: True

# ---------------------------------------------------------------------------
# Strategy and direction
# ---------------------------------------------------------------------------
# How the push path is calculated (see docs/strategies.md):
#   "columns"    - sweep the bed in blade-wide lanes, each lane starting behind
#                  the furthest part in it. Works with any layout. (default)
#   "objects"    - push each part on its own, nearest to the drop edge first.
#                  Needs free space behind every part for the blade to land.
#   "full_width" - sweep the whole bed, ignoring part positions. Needs no
#                  object labels; slowest.
variable_strategy: "columns"

# Which bed edge the parts are pushed off: "front" (Y-), "back" (Y+),
# "left" (X-) or "right" (X+).
variable_direction: "front"

# What to do when the print has no labelled objects:
#   "skip" - do nothing, "full_width" - sweep the whole bed, "error" - stop.
variable_no_objects_action: "skip"

# ---------------------------------------------------------------------------
# Blade (plow) geometry - measure after mounting it (docs/hardware.md)
# ---------------------------------------------------------------------------
# Distance from the nozzle to the blade's pushing face, along the push
# direction (positive = the blade is ahead of the nozzle).
variable_blade_offset: 20.0
# Blade width across the push direction, centred on the nozzle.
variable_blade_width: 80.0
# Overlap between neighbouring lanes in the "columns" strategy.
variable_column_overlap: 15.0
# Depth of the toolhead behind the blade, used by the "objects" strategy to
# check there is room to lower the blade.
variable_head_depth: 40.0
# Extra side margin for that check.
variable_side_margin: 5.0

# ---------------------------------------------------------------------------
# Motion
# ---------------------------------------------------------------------------
# Nozzle Z while pushing. The blade's lower edge must clear the bed at this
# height. Start high and lower it once you have watched a dry run.
variable_push_z: 1.5
# Blade lower edge above the nozzle tip, in mm. Measured by
# AUTO_EJECT_CALIBRATE (nozzle probes such as Voron Tap), "unknown" if not.
variable_blade_lift: "unknown"
# Where the measurement puts the blade's lower edge while pushing, in mm
# above the bed. push_z never goes below push_z_min, so with a blade more
# than this above the nozzle tip the nozzle sets the height instead.
variable_blade_clearance: 1.0
# Where a push ends on the push axis: "auto" = the axis limit, or a number.
variable_push_end: "auto"
# Gap left behind a part before the blade comes down.
variable_rear_clearance: 10.0
# Allow a push to start at the axis limit even if that is not behind the
# part (the blade may then land on it). Keep False unless you know why.
variable_allow_clamped_start: False
variable_push_speed: 1500      # mm/min while pushing
variable_travel_speed: 9000    # mm/min for travel moves
variable_z_speed: 600          # mm/min for Z moves
variable_push_accel: 1500      # mm/s^2 while ejecting
variable_z_hop: 5.0            # added to the current Z for travel moves
variable_min_safe_z: 20.0      # travel moves never go lower than this
variable_dry_pause: 500        # ms pause at each start point in a dry run

# ---------------------------------------------------------------------------
# Motor current - a stuck part makes the motor skip instead of breaking parts
# ---------------------------------------------------------------------------
variable_reduce_current: True
# Comma-separated steppers to reduce. CoreXY: both A/B motors
# ("stepper_x,stepper_y"). Cartesian pushing along Y: "stepper_y".
variable_current_steppers: "stepper_x,stepper_y"
variable_push_current: 0.5     # amps while pushing

# ---------------------------------------------------------------------------
# After the sweep
# ---------------------------------------------------------------------------
# Home X and Y again after pushing: a stuck part makes the motor skip on
# purpose, and re-homing makes the position exact again.
variable_rehome_xy: True
# Push a part found still on the bed again, up to this many times (0-2),
# each time lower and with more motor current.
variable_retries: 1
variable_retry_z_step: 0.3      # mm lower per retry
variable_push_z_min: 0.5        # never push lower than this
variable_retry_current_step: 0.15  # A more per retry (capped at run_current)

# ---------------------------------------------------------------------------
# Cooling
# ---------------------------------------------------------------------------
# "temperature" - wait for the bed to cool to cool_temp
# "time"        - wait cool_time seconds
# "none"        - do not wait
variable_cool_mode: "temperature"
variable_cool_temp: 32
# Another temperature for some materials, as MATERIAL=temperature with commas
# and no spaces, e.g. PETG=25,ABS=45. PETG often holds on to a smooth PEI sheet
# until the bed is cooler. The slicer names the material in the end G-code:
# AUTO_EJECT HEIGHT=[max_layer_z] MATERIAL=[filament_type] HOME=1. Materials not
# listed, and prints without MATERIAL, use cool_temp; PLA+ uses PLA's.
variable_cool_temps: ""
# The longest wait for cool_temp, in seconds. A warm room may keep the bed
# above it; after this the parts are pushed anyway, with a warning.
variable_cool_timeout: 1800
variable_cool_time: 600
variable_heaters_off: True
variable_cool_fan_speed: 1.0   # part fan while cooling, 0.0 - 1.0 (0 = off)
# While waiting, circle over the parts so the fan blows on each one: the
# parts and the sheet under them cool, and let go, sooner.
variable_cool_tour: True
variable_cool_tour_gap: 8.0     # mm between the nozzle and the tallest part
variable_cool_tour_dwell: 5.0   # seconds over each part per pass
# Cool with the printer free. The print ends first and the job queue waits;
# the bed cools in steps of a few seconds, so Push now (AUTO_EJECT_PUSH_NOW)
# and "Stop, I'll take them off" (AUTO_EJECT_CLEAR) work while it cools. Then the
# parts are pushed, the bed is checked and the queue goes on. Off: the eject
# waits for the bed inside the print, and the printer takes no command.
variable_cool_background: False

# ---------------------------------------------------------------------------
# Thin parts (stencils, flat signs)
# ---------------------------------------------------------------------------
# Prints lower than this (mm) are too thin for the blade to catch. 0 = off.
variable_min_part_height: 2.0
#   "ignore" - leave them on the bed and show a dialog (default)
#   "eject"  - push them anyway (a blade that rides on the bed)
variable_thin_parts_action: "ignore"
# Pause Moonraker's job queue while thin parts are on the bed, so the next
# job does not print on top of them. Turn off without Moonraker.
variable_thin_pause_queue: True

# ---------------------------------------------------------------------------
# Tall parts
# ---------------------------------------------------------------------------
# The tallest part to push (mm). While the blade pushes, and while the probe
# finds the bed, the toolhead and the gantry it runs on (the X beam) pass
# just above the bed, over its whole width: a taller part would be hit.
# Measure from the nozzle tip up to the lowest point of the gantry, the fans
# or the cables on the toolhead, and take a little less. Taller prints stay
# on the bed with a dialog, nothing moves, and the job queue waits for them
# (thin_pause_queue). Pass the height in the end G-code (HEIGHT=[max_layer_z]).
variable_max_part_height: 25.0

# ---------------------------------------------------------------------------
# Verification - probe where the parts were, stop the queue if one is left
# ---------------------------------------------------------------------------
variable_verify: True
# "outline" - three points just inside each part's outline (works for hollow
#             parts such as cookie cutters)
# "center"  - the centre of each part (solid parts)
variable_verify_points: "outline"
variable_verify_inset: 1.0     # mm inside the outline
variable_verify_threshold: 1.0 # mm above the empty-bed trigger height
variable_verify_z: 10.0        # Z for moves between probe points

# ---------------------------------------------------------------------------
# Recovery after a restart or power loss
# ---------------------------------------------------------------------------
# Remember the part outlines and the print height in [save_variables]
# while printing, so they survive a restart. Cleared after each successful
# eject.
variable_persist_state: True
# AUTO_EJECT_GUARD (first line of the start G-code) when parts from an
# earlier print may still be on the bed:
#   "check" - probe where they were: print if the bed is clear, push tall
#             parts off first, stop if a thin part is still there (default;
#             without a probe that can touch plastic it stops like "error")
#   "error" - stop the new print until you run AUTO_EJECT_CLEAR
#   "eject" - home around the old parts, eject and verify them, then print
variable_guard_action: "check"
# How AUTO_EJECT HOME=1 finds Z:
#   "auto"  - "probe" if Z homes with the probe, otherwise refuse
#   "probe" - home X/Y, then probe Z at the free spot furthest from all parts,
#             inside the [bed_mesh] area if there is one (on the print sheet)
#   "g28"   - plain G28 (only if your Z switch is off the bed)
variable_home_method: "auto"
variable_home_clearance: 20.0  # mm the probe spot must keep from any part
variable_home_edge_margin: 15.0 # mm kept from the axis ends when choosing it (with a [bed_mesh], also inside the mesh)

# ---------------------------------------------------------------------------
# Probe type - offset probes and eddy-current probes
# ---------------------------------------------------------------------------
# "auto" finds [probe]/[bltouch] (contact) or probe_eddy_current, beacon,
# cartographer, scanner, probe_eddy_ng (eddy). Override with "contact" or
# "eddy" if the guess is wrong.
variable_probe_type: "auto"
# Command run at each verification point. Eddy-current probes sense the metal
# bed through plastic, so with plain "PROBE" they cannot see a leftover part
# and verification is skipped with a warning. If your eddy probe has a
# contact / touch mode, put that command here (check your probe's docs).
variable_verify_probe_gcode: "PROBE"
# Command AUTO_EJECT HOME=1 uses to find Z at the chosen spot. With "PROBE"
# Z is set from the probe result. Any other command must home Z by itself
# at the current X/Y.
variable_home_z_gcode: "PROBE"
# Offset probes: while probing, keep the nozzle at least this far (mm) from
# where any part was.
variable_nozzle_clearance: 5.0
# Probes that touch the bed with the nozzle (Voron Tap, eddy touch modes):
# wait until the nozzle is this cool (C) before touching the bed, so a hot
# nozzle does not mark the print sheet. 0 = do not wait.
variable_nozzle_probe_max_temp: 150.0
# The same probes, before touching where parts are or were (checking the
# bed): wait until the nozzle is this cool (C), below where PLA softens, so
# it does not dent or stick to a part. The part fan helps it cool. 0 = do
# not wait.
variable_nozzle_part_max_temp: 50.0
# A part that cannot be probed without the nozzle passing over a part:
# "error" stops (default), "skip" warns and carries on.
variable_verify_unsafe_action: "error"

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
# Name of a Moonraker [notifier] section that gets auto-eject's messages: a
# part still on the bed after the eject, parts too thin to push, a print that
# ended without an eject, a print that did not start because of old parts.
# "" = none. install.sh --notify sets this up with ntfy (docs/notifications.md).
variable_notify: ""

# ---------------------------------------------------------------------------
# The parts box - say when the box under the drop edge is full
# ---------------------------------------------------------------------------
# How many parts the box holds. Every part pushed off counts; at 80 % you get
# a message, at the limit another. 0 = do not warn (the page still counts).
# Empty it, then run AUTO_EJECT_BIN_EMPTY (or press I emptied the box).
variable_bin_capacity: 0
# When the box is full: "stop" holds the next print in AUTO_EJECT_GUARD until
# it is emptied (needs AUTO_EJECT_GUARD in the start G-code), "notify" only
# sends the message.
variable_bin_full_action: "stop"

# ---------------------------------------------------------------------------
# The spool - with Spoolman
# ---------------------------------------------------------------------------
# With Spoolman linked to Moonraker ([spoolman] in moonraker.conf), the queue
# is checked against what is left on the printer's spool; without Spoolman,
# nothing is. Before a job the spool cannot finish:
#   "stop"   - stop the job queue before it and send a message (default;
#              needs the klipper-auto-eject service, install.sh --push)
#   "notify" - only send the message
#   "off"    - do not check
variable_spool_low_action: "stop"
variable_spool_reserve: 10.0     # grams to keep on the spool: slicer weights are estimates

# ---------------------------------------------------------------------------
# EJECT_PURGE - a tall pellet instead of a thin purge line
# ---------------------------------------------------------------------------
variable_purge_length: 30.0      # mm of filament
variable_purge_height: 6.0       # pellet height in mm
variable_purge_start_z: 0.4
variable_purge_flow: 8.0         # mm^3/s
variable_purge_retract: 0.8
variable_purge_gap: 15.0         # distance in front of the nearest part
variable_purge_edge_margin: 50.0 # keep the pellet this far from the drop edge
variable_filament_diameter: 1.75
gcode:
  {action_respond_info("_AUTO_EJECT_SETTINGS only stores settings. Use AUTO_EJECT.")}
