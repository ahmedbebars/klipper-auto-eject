# klipper-auto-eject
# https://github.com/ahmedbebars/klipper-auto-eject
#
# Core macros. Do not edit this file: it is replaced on every update.
# All user settings live in auto_eject_settings.cfg (_AUTO_EJECT_SETTINGS).
#
