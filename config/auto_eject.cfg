#####################################################################
# AUTO_EJECT - entry point
#
# A thin wrapper so the steps render in order (Klipper renders a whole
# macro before running it, and macros cannot call themselves):
#   1. capture the current print's objects (unless SOURCE=saved)
#   2. smart home if HOME=1 and the printer is not homed
#   3. _AUTO_EJECT_RUN does the actual work
#####################################################################

[gcode_macro AUTO_EJECT]
description: Push finished parts off the bed. Usage: AUTO_EJECT [STRATEGY=columns|objects|full_width] [DRY=1] [COOL=0] [VERIFY=0] [HOME=1] [SOURCE=saved]
gcode:
  {% if params.SOURCE|default("live")|lower != "saved" %}
    _AUTO_EJECT_CAPTURE
  {% endif %}
  {% if params.HOME|default(0)|int == 1 and "xyz" not in printer.toolhead.homed_axes|lower %}
    _AUTO_EJECT_HOME
  {% endif %}
  _AUTO_EJECT_RUN {rawparams}


[gcode_macro _AUTO_EJECT_RUN]
gcode:
  {% set s = printer["gcode_macro _AUTO_EJECT_SETTINGS"] %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% set th = printer.toolhead %}
  {% set cfg = printer.configfile.settings %}
  {% set strategy = params.STRATEGY|default(s.strategy)|lower %}
  {% set dry = params.DRY|default(0)|int == 1 %}
  {% set do_cool = params.COOL|default(1)|int == 1 and not dry %}
  {% set do_verify = params.VERIFY|default(1 if s.verify else 0)|int == 1 and not dry %}
  {% set direction = s.direction|lower %}

  # ------------------------------------------------------------------
  # Sanity checks
  # ------------------------------------------------------------------
  {% if strategy not in ["columns", "objects", "full_width"] %}
    {action_raise_error("AUTO_EJECT: unknown STRATEGY '%s' (use columns, objects or full_width)" % strategy)}
  {% endif %}
  {% if direction not in ["front", "back", "left", "right"] %}
    {action_raise_error("AUTO_EJECT: unknown direction '%s' in _AUTO_EJECT_SETTINGS (use front, back, left or right)" % direction)}
  {% endif %}
  {% if "xyz" not in th.homed_axes|lower %}
    {action_raise_error("AUTO_EJECT: printer is not homed. Run AUTO_EJECT HOME=1 to home safely around the parts, or remove them by hand.")}
  {% endif %}

  # ------------------------------------------------------------------
  # Axis set-up. "a" is the push axis, "c" the cross axis.
  # d = distance measured AGAINST the push direction, so parts that are
  # further from the drop edge have a larger d.
  # ------------------------------------------------------------------
  {% set ai = 1 if direction in ["front", "back"] else 0 %}
  {% set ci = 1 - ai %}
  {% set sign = -1 if direction in ["front", "left"] else 1 %}
  {% set a_lo = th.axis_minimum[ai] %}
  {% set a_hi = th.axis_maximum[ai] %}
  {% set c_lo = th.axis_minimum[ci] %}
  {% set c_hi = th.axis_maximum[ci] %}
  {% if s.push_end is string %}
    {% set a_end = a_lo if sign < 0 else a_hi %}
  {% else %}
    {% set a_end = s.push_end|float %}
  {% endif %}
  {% set d_far = -sign * (a_hi if sign < 0 else a_lo) %}
  {% set half = s.blade_width / 2.0 %}
  {% set step = s.blade_width - s.column_overlap %}
  {% set zsafe = [th.position[2] + s.z_hop, s.min_safe_z, st.height + s.z_hop]|max %}

  # ------------------------------------------------------------------
  # Object boxes in push coordinates: [d_min, d_max, c_min, c_max, name]
  # Records come from _AUTO_EJECT_STATE: [name, x0, x1, y0, y1, ...]
  # ------------------------------------------------------------------
  {% set ns = namespace(boxes=[], cmin=999999.0, cmax=-999999.0) %}
  {% for r in st.objects %}
    {% set a0 = r[1 + 2 * ai] %}
    {% set a1 = r[2 + 2 * ai] %}
    {% set c0 = r[1 + 2 * ci] %}
    {% set c1 = r[2 + 2 * ci] %}
    {% set d0 = [-sign * a0, -sign * a1]|min %}
    {% set d1 = [-sign * a0, -sign * a1]|max %}
    {% set ns.boxes = ns.boxes + [[d0, d1, c0, c1, r[0]]] %}
    {% if c0 < ns.cmin %}{% set ns.cmin = c0 %}{% endif %}
    {% if c1 > ns.cmax %}{% set ns.cmax = c1 %}{% endif %}
  {% endfor %}

  {% if ns.boxes|length == 0 and strategy != "full_width" %}
    {% if s.no_objects_action == "full_width" %}
      {action_respond_info("AUTO_EJECT: no labelled objects found, falling back to a full-width sweep")}
      {% set strategy = "full_width" %}
    {% elif s.no_objects_action == "error" %}
      {action_raise_error("AUTO_EJECT: no labelled objects found. Enable 'Label objects' / 'Exclude objects' in your slicer.")}
    {% else %}
      {action_respond_info("AUTO_EJECT: no labelled objects found, nothing to do")}
      {% set strategy = "skip" %}
    {% endif %}
  {% endif %}

  {% if strategy != "skip" %}
    {action_respond_info("AUTO_EJECT: strategy=%s direction=%s objects=%d safe_z=%.1f%s" % (strategy, direction, ns.boxes|length, zsafe, " [DRY RUN]" if dry else ""))}

    # ----------------------------------------------------------------
    # Build the list of pushes: [c, d_start]
    # ----------------------------------------------------------------
    {% set pushes = namespace(list=[], clamped=False) %}
    {% if strategy == "objects" %}
      {% set sorted_boxes = ns.boxes|sort(attribute="0") %}
      {% for bx in sorted_boxes %}
        {% set i = loop.index0 %}
        {% set c = (bx[2] + bx[3]) / 2.0 %}
        {% set d_start = bx[1] + s.rear_clearance + s.blade_offset %}
        {% for other in sorted_boxes %}
          {% if loop.index0 > i %}
            {% if other[3] > c - half - s.side_margin and other[2] < c + half + s.side_margin and other[1] > bx[1] and other[0] < d_start + s.head_depth %}
              {action_raise_error("AUTO_EJECT: '%s' sits where the blade must come down behind '%s'. Leave more space between parts or use STRATEGY=columns." % (other[4], bx[4]))}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% set pushes.list = pushes.list + [[c, d_start]] %}
      {% endfor %}
    {% else %}
      {% if strategy == "full_width" %}
        {% set r_lo = c_lo + half - s.column_overlap / 2.0 %}
        {% set r_hi = c_hi %}
      {% else %}
        {% set r_lo = ns.cmin + half - s.column_overlap / 2.0 %}
        {% set r_hi = ns.cmax %}
      {% endif %}
      {% for k in range(0, 100) %}
        {% set c = r_lo + k * step %}
        {% if c - half < r_hi %}
          {% set col = namespace(dmax=-999999.0) %}
          {% for bx in ns.boxes %}
            {% if bx[3] > c - half and bx[2] < c + half and bx[1] > col.dmax %}
              {% set col.dmax = bx[1] %}
            {% endif %}
          {% endfor %}
          {% if strategy == "full_width" %}
            {% set pushes.list = pushes.list + [[c, d_far]] %}
          {% elif col.dmax > -999999.0 %}
            {% set pushes.list = pushes.list + [[c, col.dmax + s.rear_clearance + s.blade_offset]] %}
          {% endif %}
        {% endif %}
      {% endfor %}
    {% endif %}

    # check the start points are reachable
    {% for p in pushes.list %}
      {% if p[1] > d_far + 0.001 %}{% set pushes.clamped = True %}{% endif %}
    {% endfor %}
    {% if pushes.clamped and not dry and not s.allow_clamped_start %}
      {action_raise_error("AUTO_EJECT: a part is too close to the far edge of the bed: the blade cannot get behind it. Move parts away from that edge, or set allow_clamped_start: True.")}
    {% endif %}

    # ----------------------------------------------------------------
    # Cool down
    # ----------------------------------------------------------------
    {% if do_cool %}
      {% if s.heaters_off %}
        M104 S0
        {% if "heater_bed" in printer %}M140 S0{% endif %}
      {% endif %}
      {% if s.cool_fan_speed > 0 %}
        M106 S{(s.cool_fan_speed * 255)|round|int}
      {% endif %}
      G90
      G1 Z{zsafe} F{s.z_speed}
      {% if s.cool_mode == "temperature" and "heater_bed" in printer %}
        {action_respond_info("AUTO_EJECT: waiting for the bed to reach %.0f C" % s.cool_temp)}
        TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM={s.cool_temp}
      {% elif s.cool_mode == "time" %}
        {action_respond_info("AUTO_EJECT: waiting %d s for parts to cool" % s.cool_time)}
        G4 P{(s.cool_time * 1000)|int}
      {% endif %}
    {% endif %}

    # ----------------------------------------------------------------
    # Lower motor current on the push steppers
    # ----------------------------------------------------------------
    {% set drv = namespace(list=[]) %}
    {% if s.reduce_current and not dry %}
      {% for stp in s.current_steppers.split(",") %}
        {% set stp = stp|trim|lower %}
        {% for kind in ["tmc2130", "tmc2208", "tmc2209", "tmc2240", "tmc2660", "tmc5160", "tmc5262"] %}
          {% if (kind ~ " " ~ stp) in cfg %}
            {% set drv.list = drv.list + [[stp, cfg[kind ~ " " ~ stp].run_current]] %}
          {% endif %}
        {% endfor %}
      {% endfor %}
    {% endif %}

    SAVE_GCODE_STATE NAME=_auto_eject
    G90
    SET_VELOCITY_LIMIT ACCEL={s.push_accel}
    {% for d in drv.list %}
      SET_TMC_CURRENT STEPPER={d[0]} CURRENT={s.push_current}
    {% endfor %}
    G1 Z{zsafe} F{s.z_speed}

    # ----------------------------------------------------------------
    # Push
    # ----------------------------------------------------------------
    {% for p in pushes.list %}
      {% set cc = [[p[0], c_lo]|max, c_hi]|min %}
      {% set a_start = [[-sign * [p[1], d_far]|min, a_lo]|max, a_hi]|min %}
      {% if ai == 1 %}
        G1 X{"%.3f" % cc} Y{"%.3f" % a_start} F{s.travel_speed}
      {% else %}
        G1 X{"%.3f" % a_start} Y{"%.3f" % cc} F{s.travel_speed}
      {% endif %}
      {% if dry %}
        G4 P{s.dry_pause}
        {% if ai == 1 %}G1 Y{"%.3f" % a_end} F{s.travel_speed}{% else %}G1 X{"%.3f" % a_end} F{s.travel_speed}{% endif %}
      {% else %}
        G1 Z{s.push_z} F{s.z_speed}
        {% if ai == 1 %}G1 Y{"%.3f" % a_end} F{s.push_speed}{% else %}G1 X{"%.3f" % a_end} F{s.push_speed}{% endif %}
      {% endif %}
      G1 Z{zsafe} F{s.z_speed}
    {% endfor %}
    M400

    # ----------------------------------------------------------------
    # Restore
    # ----------------------------------------------------------------
    {% for d in drv.list %}
      SET_TMC_CURRENT STEPPER={d[0]} CURRENT={d[1]}
    {% endfor %}
    SET_VELOCITY_LIMIT ACCEL={th.max_accel}
    {% if do_cool and s.cool_fan_speed > 0 %}M107{% endif %}
    RESTORE_GCODE_STATE NAME=_auto_eject

    {% if dry %}
      {action_respond_info("AUTO_EJECT: dry run finished (%d push%s)" % (pushes.list|length, "" if pushes.list|length == 1 else "es"))}
    {% elif do_verify and strategy != "full_width" %}
      _AUTO_EJECT_VERIFY
    {% else %}
      {action_respond_info("AUTO_EJECT: sweep finished (%d push%s), not verified" % (pushes.list|length, "" if pushes.list|length == 1 else "es"))}
      _AUTO_EJECT_CLEAR_STATE
    {% endif %}
  {% endif %}


#####################################################################
# Verification with the probe
#####################################################################

[gcode_macro _AUTO_EJECT_VERIFY]
description: Probe where the parts were; stop with an error if any is still there
gcode:
  {% set s = printer["gcode_macro _AUTO_EJECT_SETTINGS"] %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% set cfg = printer.configfile.settings %}
  {% set th = printer.toolhead %}
  {% set pr = cfg.probe if "probe" in cfg else (cfg.bltouch if "bltouch" in cfg else None) %}
  {% if pr is none %}
    {action_respond_info("AUTO_EJECT: no [probe] or [bltouch] section, bed check skipped")}
    _AUTO_EJECT_CLEAR_STATE
  {% else %}
    {% set ox = pr.x_offset|default(0.0) %}
    {% set oy = pr.y_offset|default(0.0) %}
    {% set n_pts = namespace(count=0) %}
    G90
    {% for r in st.objects %}
      {% set targets = [[r[5], r[6]]] if s.verify_points == "center" else r[7] %}
      {% for t in targets %}
        {% set nx = t[0] - ox %}
        {% set ny = t[1] - oy %}
        {% if nx >= th.axis_minimum[0] and nx <= th.axis_maximum[0] and ny >= th.axis_minimum[1] and ny <= th.axis_maximum[1] %}
          {% set n_pts.count = n_pts.count + 1 %}
          G1 Z{s.verify_z} F{s.z_speed}
          G1 X{"%.3f" % nx} Y{"%.3f" % ny} F{s.travel_speed}
          PROBE
          _AUTO_EJECT_CHECK NAME="{r[0]}"
        {% endif %}
      {% endfor %}
    {% endfor %}
    G1 Z{s.verify_z} F{s.z_speed}
    {action_respond_info("AUTO_EJECT: bed verified clear (%d probe point%s)" % (n_pts.count, "" if n_pts.count == 1 else "s"))}
    _AUTO_EJECT_CLEAR_STATE
  {% endif %}


[gcode_macro _AUTO_EJECT_CHECK]
gcode:
  {% set s = printer["gcode_macro _AUTO_EJECT_SETTINGS"] %}
  {% set cfg = printer.configfile.settings %}
  {% set pr = cfg.probe if "probe" in cfg else cfg.bltouch %}
  # last_z_result is the toolhead Z at the moment the probe triggered
  {% set z = printer.probe.last_z_result %}
  {% set limit = pr.z_offset + s.verify_threshold %}
  {% if z > limit %}
    G1 Z{s.verify_z} F{s.z_speed}
    {action_raise_error("AUTO_EJECT: '%s' is STILL ON THE BED (probe hit at Z=%.2f, limit %.2f). Stopping so the next job does not start." % (params.NAME|default("object"), z, limit))}
  {% endif %}


#####################################################################
# Print state: object outlines and print height, kept across restarts
#
# Records: [name, x0, x1, y0, y1, cx, cy, [[x, y], [x, y], [x, y]]]
# The three points sit just inside the outline and are used to verify
# hollow parts. Saved in [save_variables] as auto_eject_objects and
# auto_eject_height, and cleared after a successful eject.
#####################################################################

[gcode_macro _AUTO_EJECT_STATE]
variable_objects: []
variable_height: 0.0
variable_job: ""
variable_last_duration: 0.0
variable_captured: False
gcode:

[gcode_macro _AUTO_EJECT_CAPTURE]
description: Store the current print's object outlines in _AUTO_EJECT_STATE
gcode:
  {% set s = printer["gcode_macro _AUTO_EJECT_SETTINGS"] %}
  {% set live = printer.exclude_object.objects if "exclude_object" in printer else [] %}
  {% if live|length > 0 %}
    {% set ns = namespace(recs=[]) %}
    {% for o in live %}
      {% set pts = o.polygon %}
      {% set n = pts|length %}
      {% if n > 0 %}
        {% set b = namespace(x0=999999.0, x1=-999999.0, y0=999999.0, y1=-999999.0) %}
        {% for p in pts %}
          {% if p[0] < b.x0 %}{% set b.x0 = p[0] %}{% endif %}
          {% if p[0] > b.x1 %}{% set b.x1 = p[0] %}{% endif %}
          {% if p[1] < b.y0 %}{% set b.y0 = p[1] %}{% endif %}
          {% if p[1] > b.y1 %}{% set b.y1 = p[1] %}{% endif %}
        {% endfor %}
        {% set cx = o.center[0] if o.center else (b.x0 + b.x1) / 2.0 %}
        {% set cy = o.center[1] if o.center else (b.y0 + b.y1) / 2.0 %}
        {% set vp = namespace(list=[]) %}
        {% for k in [0, (n / 3)|int, (2 * n / 3)|int] %}
          {% set p = pts[k] %}
          {% set dx = cx - p[0] %}
          {% set dy = cy - p[1] %}
          {% set dist = (dx * dx + dy * dy) ** 0.5 %}
          {% set f = (s.verify_inset / dist) if dist > s.verify_inset else 0.0 %}
          {% set vp.list = vp.list + [[(p[0] + dx * f)|round(2), (p[1] + dy * f)|round(2)]] %}
        {% endfor %}
        {% set name = o.name|replace("'", "")|replace('"', "") %}
        {% set ns.recs = ns.recs + [[name, b.x0|round(2), b.x1|round(2), b.y0|round(2), b.y1|round(2), cx|round(2), cy|round(2), vp.list]] %}
      {% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=objects VALUE='{ns.recs|tojson}'
    {% if s.persist_state and "save_variables" in printer %}
      SAVE_VARIABLE VARIABLE=auto_eject_objects VALUE='{ns.recs|tojson}'
    {% endif %}
  {% endif %}

[gcode_macro _AUTO_EJECT_CLEAR_STATE]
description: Forget the stored objects after a successful eject
gcode:
  {% set s = printer["gcode_macro _AUTO_EJECT_SETTINGS"] %}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=objects VALUE='[]'
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=height VALUE=0.0
  {% if s.persist_state and "save_variables" in printer %}
    SAVE_VARIABLE VARIABLE=auto_eject_objects VALUE='[]'
    SAVE_VARIABLE VARIABLE=auto_eject_height VALUE=0.0
  {% endif %}

[gcode_macro AUTO_EJECT_CLEAR]
description: Tell auto-eject the bed is clear (after removing parts by hand)
gcode:
  _AUTO_EJECT_CLEAR_STATE
  {action_respond_info("AUTO_EJECT: stored parts forgotten, the bed is treated as clear")}

[delayed_gcode _AUTO_EJECT_TRACK]
initial_duration: 10
gcode:
  _AUTO_EJECT_TRACK_STEP
  UPDATE_DELAYED_GCODE ID=_AUTO_EJECT_TRACK DURATION=30

[gcode_macro _AUTO_EJECT_TRACK_STEP]
gcode:
  {% set s = printer["gcode_macro _AUTO_EJECT_SETTINGS"] %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% set ps = printer.print_stats %}
  {% set persist = s.persist_state and "save_variables" in printer %}
  {% set live = printer.exclude_object.objects if "exclude_object" in printer else [] %}
  {% if s.persist_state and ps.state == "printing" %}
    {% set new_job = ps.filename != st.job or ps.total_duration < st.last_duration %}
    {% set captured = st.captured and not new_job %}
    {% if new_job %}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=job VALUE='{ps.filename|tojson}'
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=captured VALUE=False
    {% endif %}
    # Parts from an earlier print that were never ejected are kept until
    # AUTO_EJECT_GUARD (or AUTO_EJECT_CLEAR) deals with them.
    {% if not captured and st.objects|length == 0 and live|length > 0 %}
      _AUTO_EJECT_CAPTURE
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=captured VALUE=True
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=height VALUE=0.0
      {% if persist %}SAVE_VARIABLE VARIABLE=auto_eject_height VALUE=0.0{% endif %}
    {% elif captured %}
      {% set z = printer.toolhead.position[2] %}
      {% if z > st.height + 0.5 %}
        SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=height VALUE={"%.2f" % z}
        {% if persist %}SAVE_VARIABLE VARIABLE=auto_eject_height VALUE={"%.2f" % z}{% endif %}
      {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=last_duration VALUE={ps.total_duration}
  {% endif %}


#####################################################################
# AUTO_EJECT_GUARD - put it first in the slicer's start G-code
#
# If the printer still remembers parts that were never ejected (power
# loss, restart, emergency stop), do not print on top of them:
#   guard_action "error" - stop the new print (default)
#   guard_action "eject" - home safely around the old parts, eject them
#                          and verify, then let the print continue
#####################################################################

[gcode_macro AUTO_EJECT_GUARD]
description: Stop or eject before printing if parts from an earlier print may still be on the bed
gcode:
  {% set s = printer["gcode_macro _AUTO_EJECT_SETTINGS"] %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% if st.objects|length > 0 %}
    {% if s.guard_action == "eject" %}
      {action_respond_info("AUTO_EJECT_GUARD: %d part(s) from an earlier print may still be on the bed, ejecting them first" % st.objects|length)}
      AUTO_EJECT HOME=1 SOURCE=saved
    {% else %}
      {action_raise_error("AUTO_EJECT_GUARD: %d part(s) from an earlier print may still be on the bed. Run AUTO_EJECT HOME=1 SOURCE=saved, or remove them and run AUTO_EJECT_CLEAR." % st.objects|length)}
    {% endif %}
  {% endif %}


#####################################################################
# Smart homing around the parts
#
# X and Y are homed normally (they never touch the bed). Z is measured
# with the probe at the free spot furthest from every stored part, so a
# part can never be mistaken for the bed.
#####################################################################

[gcode_macro _AUTO_EJECT_HOME]
gcode:
  {% set s = printer["gcode_macro _AUTO_EJECT_SETTINGS"] %}
  {% set cfg = printer.configfile.settings %}
  {% set raw = printer.configfile.config %}
  {% set method = s.home_method|lower %}
  {% if method == "auto" %}
    {% set zpin = (cfg.stepper_z.endstop_pin|default(""))|lower|replace(" ", "") %}
    {% set method = "probe" if "probe:z_virtual_endstop" in zpin else "refuse" %}
  {% endif %}
  {% if method == "refuse" %}
    {action_raise_error("AUTO_EJECT HOME=1: Z homes with a switch, so homing could touch a part. If that switch is off the bed, set home_method to g28.")}
  {% elif method == "g28" %}
    G28
  {% elif method == "probe" %}
    {% if "force_move" not in cfg or not cfg.force_move.enable_force_move %}
      {action_raise_error("AUTO_EJECT HOME=1 needs [force_move] with enable_force_move: True")}
    {% endif %}
    {% if "probe" not in cfg and "bltouch" not in cfg %}
      {action_raise_error("AUTO_EJECT HOME=1 needs a [probe] or [bltouch]")}
    {% endif %}
    {% if "x" not in printer.toolhead.homed_axes|lower or "y" not in printer.toolhead.homed_axes|lower %}
      G28 X Y
    {% endif %}
    _AUTO_EJECT_HOME_Z
  {% else %}
    {action_raise_error("AUTO_EJECT: unknown home_method '%s' (use auto, probe or g28)" % method)}
  {% endif %}

[gcode_macro _AUTO_EJECT_HOME_Z]
gcode:
  {% set s = printer["gcode_macro _AUTO_EJECT_SETTINGS"] %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% set cfg = printer.configfile.settings %}
  {% set th = printer.toolhead %}
  {% set pr = cfg.probe if "probe" in cfg else cfg.bltouch %}
  {% set ox = pr.x_offset|default(0.0) %}
  {% set oy = pr.y_offset|default(0.0) %}
  # probe positions the probe can reach, kept away from the bed edges
  {% set x_lo = [th.axis_minimum[0] + ox, th.axis_minimum[0]]|max + s.home_edge_margin %}
  {% set x_hi = [th.axis_maximum[0] + ox, th.axis_maximum[0]]|min - s.home_edge_margin %}
  {% set y_lo = [th.axis_minimum[1] + oy, th.axis_minimum[1]]|max + s.home_edge_margin %}
  {% set y_hi = [th.axis_maximum[1] + oy, th.axis_maximum[1]]|min - s.home_edge_margin %}
  {% set mx = (x_lo + x_hi) / 2.0 %}
  {% set my = (y_lo + y_hi) / 2.0 %}
  {% set best = namespace(x=mx, y=my, score=-999999.0, clear=999999.0) %}
  {% for i in range(0, 21) %}
    {% for j in range(0, 21) %}
      {% set px = x_lo + (x_hi - x_lo) * i / 20.0 %}
      {% set py = y_lo + (y_hi - y_lo) * j / 20.0 %}
      {% set m = namespace(d=999999.0) %}
      {% for r in st.objects %}
        {% set dx = [r[1] - px, 0.0, px - r[2]]|max %}
        {% set dy = [r[3] - py, 0.0, py - r[4]]|max %}
        {% set d = (dx * dx + dy * dy) ** 0.5 %}
        {% if d < m.d %}{% set m.d = d %}{% endif %}
      {% endfor %}
      # prefer spots well clear of parts, then the one nearest the centre
      {% set score = [m.d, 60.0]|min - 0.01 * ((px - mx) ** 2 + (py - my) ** 2) ** 0.5 %}
      {% if score > best.score %}
        {% set best.x = px %}
        {% set best.y = py %}
        {% set best.score = score %}
        {% set best.clear = m.d %}
      {% endif %}
    {% endfor %}
  {% endfor %}
  {% if best.clear < s.home_clearance %}
    {action_raise_error("AUTO_EJECT HOME=1: no free spot at least %.0f mm from every part. Remove the parts by hand." % s.home_clearance)}
  {% endif %}
  {action_respond_info("AUTO_EJECT: homing Z at X=%.1f Y=%.1f, %.0f mm from the nearest part" % (best.x, best.y, [best.clear, 999.0]|min))}
  G90
  G1 X{"%.3f" % (best.x - ox)} Y{"%.3f" % (best.y - oy)} F{s.travel_speed}
  M400
  # Pretend the bed is far below, then let the probe find it.
  SET_KINEMATIC_POSITION Z={th.axis_maximum[2] - 5.0}
  PROBE
  _AUTO_EJECT_HOME_Z_SET

[gcode_macro _AUTO_EJECT_HOME_Z_SET]
gcode:
  {% set s = printer["gcode_macro _AUTO_EJECT_SETTINGS"] %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% set cfg = printer.configfile.settings %}
  {% set pr = cfg.probe if "probe" in cfg else cfg.bltouch %}
  # When the probe triggers the nozzle is z_offset above the bed.
  {% set z_now = pr.z_offset + (printer.toolhead.position[2] - printer.probe.last_z_result) %}
  SET_KINEMATIC_POSITION Z={"%.4f" % z_now}
  G90
  G1 Z{[s.min_safe_z, st.height + s.z_hop]|max} F{s.z_speed}
  {action_respond_info("AUTO_EJECT: Z homed around the parts")}


#####################################################################
# EJECT_PURGE
#####################################################################

[gcode_macro EJECT_PURGE]
description: Purge a tall pellet in front of the parts (the sweep pushes it off). Usage: EJECT_PURGE [X=..] [Y=..]
gcode:
  {% set s = printer["gcode_macro _AUTO_EJECT_SETTINGS"] %}
  {% set th = printer.toolhead %}
  {% set direction = s.direction|lower %}
  {% set ai = 1 if direction in ["front", "back"] else 0 %}
  {% set ci = 1 - ai %}
  {% set sign = -1 if direction in ["front", "left"] else 1 %}
  {% set edge = th.axis_minimum[ai] if sign < 0 else th.axis_maximum[ai] %}

  # default position: centred on the parts, in front of the front-most one
  {% set objs = printer.exclude_object.objects if "exclude_object" in printer else [] %}
  {% set ns = namespace(cmin=999999.0, cmax=-999999.0, dmin=999999.0) %}
  {% for o in objs %}
    {% for p in o.polygon %}
      {% if p[ci] < ns.cmin %}{% set ns.cmin = p[ci] %}{% endif %}
      {% if p[ci] > ns.cmax %}{% set ns.cmax = p[ci] %}{% endif %}
      {% if -sign * p[ai] < ns.dmin %}{% set ns.dmin = -sign * p[ai] %}{% endif %}
    {% endfor %}
  {% endfor %}
  {% if ns.cmax > -999999.0 %}
    {% set c_def = (ns.cmin + ns.cmax) / 2.0 %}
    {% set d_def = [ns.dmin - s.purge_gap, -sign * edge + s.purge_edge_margin]|max %}
  {% else %}
    {% set c_def = (th.axis_minimum[ci] + th.axis_maximum[ci]) / 2.0 %}
    {% set d_def = -sign * edge + s.purge_edge_margin %}
  {% endif %}
  {% set a_def = -sign * d_def %}
  {% set x = params.X|default(a_def if ai == 0 else c_def)|float %}
  {% set y = params.Y|default(a_def if ai == 1 else c_def)|float %}

  # rise speed so the volumetric flow equals purge_flow
  {% set area = 3.14159 * (s.filament_diameter / 2.0) ** 2 %}
  {% set seconds = s.purge_length * area / s.purge_flow %}
  {% set rise_f = (s.purge_height - s.purge_start_z) / seconds * 60.0 %}

  {% set ext = printer.configfile.settings.extruder %}
  {% if printer.extruder.temperature < ext.min_extrude_temp %}
    {action_raise_error("EJECT_PURGE: the nozzle is not hot enough to purge")}
  {% endif %}
  # Klipper limits extrusion per mm of travel; a pellet extrudes a lot while
  # only moving up a few mm, so check the limit before trying.
  {% set needed = s.purge_length / (s.purge_height - s.purge_start_z) * area %}
  {% if ext.max_extrude_cross_section|default(0.64) < needed %}
    {action_raise_error("EJECT_PURGE: [extruder] max_extrude_cross_section must be at least %.1f for this pellet (it is %.2f). Raise it, or make purge_height larger / purge_length smaller." % (needed, ext.max_extrude_cross_section|default(0.64)))}
  {% endif %}
  SAVE_GCODE_STATE NAME=_eject_purge
  G90
  G1 Z{[th.position[2], 5.0]|max} F{s.z_speed}
  G1 X{"%.3f" % x} Y{"%.3f" % y} F{s.travel_speed}
  G1 Z{s.purge_start_z} F{s.z_speed}
  M83
  G1 E{s.purge_length} Z{s.purge_height} F{"%.1f" % rise_f}
  G1 E-{s.purge_retract} F2400
  G1 Z{s.purge_height + 2.0} F{s.z_speed}
  RESTORE_GCODE_STATE NAME=_eject_purge


#####################################################################
# Saved settings
#
# Values saved by AUTO_EJECT_SETUP live in [save_variables] as
# auto_eject_<setting>. They are applied on top of
# auto_eject_settings.cfg one second after Klipper starts.
#####################################################################

[delayed_gcode _AUTO_EJECT_LOAD]
initial_duration: 1
gcode:
  _AUTO_EJECT_APPLY_SAVED

[gcode_macro _AUTO_EJECT_APPLY_SAVED]
gcode:
  {% if "save_variables" in printer %}
    {% set s = printer["gcode_macro _AUTO_EJECT_SETTINGS"] %}
    {% set saved = printer.save_variables.variables %}
    {% for key in saved %}
      {% if key.startswith("auto_eject_") and saved[key] is not none %}
        {% set name = key[11:] %}
        {% if name in ["objects", "height"] %}
          SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE={name} VALUE='{saved[key]|tojson}'
        {% elif name in s %}
          SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_SETTINGS VARIABLE={name} VALUE='{saved[key]|tojson}'
        {% endif %}
      {% endif %}
    {% endfor %}
  {% endif %}


#####################################################################
# AUTO_EJECT_SETUP - guided setup in Mainsail / Fluidd
#
# Every step is a dialog with buttons. The buttons call
# AUTO_EJECT_SETUP STEP=<name> again, so the wizard is a small state
# machine; values in progress live in _AUTO_EJECT_WIZARD.
# Dialog text must not contain double quotes, '#' or ';'.
#####################################################################

[gcode_macro _AUTO_EJECT_WIZARD]
variable_direction: "front"
variable_steppers: "stepper_x,stepper_y"
variable_push_z: 3.0
variable_a_blade: 0.0
variable_blade_offset: 20.0
variable_blade_width: 80.0
variable_push_current: 0.5
variable_cool_mode: "temperature"
variable_cool_temp: 28
variable_cool_time: 600
gcode:

[gcode_macro AUTO_EJECT_SETUP]
description: Guided setup for klipper-auto-eject (opens a dialog in Mainsail/Fluidd)
gcode:
  {% set step = params.STEP|default("start")|lower %}
  {% set value = params.VALUE|default("") %}
  {% set s = printer["gcode_macro _AUTO_EJECT_SETTINGS"] %}
  {% set w = printer["gcode_macro _AUTO_EJECT_WIZARD"] %}
  {% set cfg = printer.configfile.settings %}
  # sections without options, e.g. [exclude_object], only appear in .config
  {% set raw = printer.configfile.config %}
  {% set th = printer.toolhead %}
  {% set ai = 1 if w.direction in ["front", "back"] else 0 %}
  {% set axis = "Y" if ai == 1 else "X" %}
  {% set sign = -1 if w.direction in ["front", "left"] else 1 %}
  {% if "respond" not in raw %}
    {action_raise_error("AUTO_EJECT_SETUP needs a [respond] section in printer.cfg to show its dialogs. Add [respond] and run FIRMWARE_RESTART.")}
  {% endif %}

  {% macro begin(title) -%}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Auto-eject setup - {title}"
  {%- endmacro %}
  {% macro text(t) -%}
  RESPOND TYPE=command MSG="action:prompt_text {t}"
  {%- endmacro %}
  {% macro button(label, gcode, color="primary") -%}
  RESPOND TYPE=command MSG="action:prompt_button {label}|{gcode}|{color}"
  {%- endmacro %}
  {% macro footer(label, gcode, color="secondary") -%}
  RESPOND TYPE=command MSG="action:prompt_footer_button {label}|{gcode}|{color}"
  {%- endmacro %}
  {% macro group_start() -%}
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {%- endmacro %}
  {% macro group_end() -%}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {%- endmacro %}
  {% macro show() -%}
  RESPOND TYPE=command MSG="action:prompt_show"
  {%- endmacro %}
  {% macro wset(var, val) -%}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_WIZARD VARIABLE={var} VALUE={val}
  {%- endmacro %}
  {% macro wset_str(var, val) -%}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_WIZARD VARIABLE={var} VALUE='"{val}"'
  {%- endmacro %}
  {% macro jog_rows(next, axis, sign) -%}
  {group_start()}
  {button("Toward edge 10", "_AUTO_EJECT_JOG AXIS=%s DIST=%.1f NEXT=%s" % (axis, 10 * sign, next), "secondary")}
  {button("1", "_AUTO_EJECT_JOG AXIS=%s DIST=%.1f NEXT=%s" % (axis, 1 * sign, next), "secondary")}
  {button("0.1", "_AUTO_EJECT_JOG AXIS=%s DIST=%.2f NEXT=%s" % (axis, 0.1 * sign, next), "secondary")}
  {group_end()}
  {group_start()}
  {button("Away 10", "_AUTO_EJECT_JOG AXIS=%s DIST=%.1f NEXT=%s" % (axis, -10 * sign, next), "secondary")}
  {button("1", "_AUTO_EJECT_JOG AXIS=%s DIST=%.1f NEXT=%s" % (axis, -1 * sign, next), "secondary")}
  {button("0.1", "_AUTO_EJECT_JOG AXIS=%s DIST=%.2f NEXT=%s" % (axis, -0.1 * sign, next), "secondary")}
  {group_end()}
  {%- endmacro %}
  {% set cancel_label = "Cancel" %}
  {% set cancel_gcode = "AUTO_EJECT_SETUP STEP=close" %}

  # ------------------------------------------------------------------ start
  {% if step == "start" %}
    {wset_str("direction", s.direction)}
    {wset_str("steppers", s.current_steppers)}
    {wset("push_z", s.push_z)}
    {wset("blade_offset", s.blade_offset)}
    {wset("blade_width", s.blade_width)}
    {wset("push_current", s.push_current)}
    {wset_str("cool_mode", s.cool_mode)}
    {wset("cool_temp", s.cool_temp)}
    {wset("cool_time", s.cool_time)}
    {begin("welcome")}
    {text("This guide sets up automatic bed clearing in about 10 minutes. You need the blade mounted on the toolhead and a small block with a flat side, such as a 20 mm calibration cube.")}
    {text("OK - exclude_object is enabled" if "exclude_object" in raw else "MISSING - add [exclude_object] to printer.cfg before printing")}
    {text("OK - probe found, the bed is verified after each eject" if ("probe" in raw or "bltouch" in raw) else "NOTE - no probe found, the bed will not be verified")}
    {text("OK - settings will be saved permanently" if "save_variables" in printer else "NOTE - no [save_variables], you will get lines to paste into auto_eject_settings.cfg")}
    {text("Kinematics: %s" % cfg.printer.kinematics)}
    {button("Start", "AUTO_EJECT_SETUP STEP=direction")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  # -------------------------------------------------------------- direction
  {% elif step == "direction" %}
    {begin("1 of 8 - drop edge")}
    {text("Which bed edge should the parts fall off? Put a box under that edge.")}
    {text("On bed slingers, left or right is usually best, so the moving bed does not shake the parts.")}
    {group_start()}
    {button("Front", "AUTO_EJECT_SETUP STEP=set_direction VALUE=front")}
    {button("Back", "AUTO_EJECT_SETUP STEP=set_direction VALUE=back")}
    {group_end()}
    {group_start()}
    {button("Left", "AUTO_EJECT_SETUP STEP=set_direction VALUE=left")}
    {button("Right", "AUTO_EJECT_SETUP STEP=set_direction VALUE=right")}
    {group_end()}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "set_direction" %}
    {% set d = value|lower %}
    {% if d not in ["front", "back", "left", "right"] %}
      {action_raise_error("AUTO_EJECT_SETUP: unknown direction '%s'" % value)}
    {% endif %}
    {wset_str("direction", d)}
    {% if cfg.printer.kinematics in ["corexy", "corexz", "hybrid_corexy", "hybrid_corexz", "limited_corexy"] %}
      {wset_str("steppers", "stepper_x,stepper_y")}
    {% else %}
      {% set a = "stepper_y" if d in ["front", "back"] else "stepper_x" %}
      {wset_str("steppers", (a ~ "," ~ a ~ "1") if (a ~ "1") in cfg else a)}
    {% endif %}
    AUTO_EJECT_SETUP STEP=surface

  # ---------------------------------------------------------------- surface
  {% elif step == "surface" %}
    {begin("2 of 8 - bed surface")}
    {text("Auto-eject only works if cooled parts let go of the bed.")}
    {text("Test it once: after a print, let the bed cool to room temperature, then push a part sideways with one finger.")}
    {button("It slides off", "AUTO_EJECT_SETUP STEP=prepare")}
    {button("It stays stuck", "AUTO_EJECT_SETUP STEP=surface_no", "warning")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "surface_no" %}
    {begin("bed surface")}
    {text("Parts that need the sheet flexed to come off cannot be pushed off reliably.")}
    {text("Try a textured PEI sheet, a lower cool-down temperature or a release agent, then run AUTO_EJECT_SETUP again.")}
    {footer("Close", cancel_gcode)}
    {show()}

  # ---------------------------------------------------------------- prepare
  {% elif step == "prepare" %}
    {begin("3 of 8 - prepare")}
    {text("Clear the bed completely. The printer homes if needed and moves to the centre of the bed.")}
    {text("Keep your hands away from the printer while it moves.")}
    {button("Bed is clear - move", "AUTO_EJECT_SETUP STEP=goto_center")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "goto_center" %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if "xyz" not in th.homed_axes|lower %}
      G28
    {% endif %}
    _AUTO_EJECT_SETUP_CENTER

  # ----------------------------------------------------------------- height
  {% elif step == "height" %}
    {begin("4 of 8 - blade height")}
    {text("Lower the toolhead until the BLADE lower edge is about 2 mm above the bed. Two stacked coins under the blade make a good gauge.")}
    {text("The nozzle must never touch the bed. The toolhead will not go below Z 0.5.")}
    {text("Current Z: %.2f mm" % th.position[2])}
    {group_start()}
    {button("Z +1", "_AUTO_EJECT_JOG AXIS=Z DIST=1 NEXT=height", "secondary")}
    {button("Z +0.1", "_AUTO_EJECT_JOG AXIS=Z DIST=0.1 NEXT=height", "secondary")}
    {button("Z -0.1", "_AUTO_EJECT_JOG AXIS=Z DIST=-0.1 NEXT=height", "secondary")}
    {button("Z -1", "_AUTO_EJECT_JOG AXIS=Z DIST=-1 NEXT=height", "secondary")}
    {group_end()}
    {button("Save this height", "AUTO_EJECT_SETUP STEP=save_height")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "save_height" %}
    {wset("push_z", "%.2f" % th.position[2])}
    AUTO_EJECT_SETUP STEP=offset_intro

  # ----------------------------------------------------------------- offset
  {% elif step == "offset_intro" %}
    {begin("5 of 8 - blade position")}
    {text("Next the printer measures how far the blade sits in front of the nozzle. No ruler needed.")}
    {text("Place the block on the bed between the toolhead and the %s edge, with a flat side facing the blade." % w.direction)}
    {button("Block is in place", "AUTO_EJECT_SETUP STEP=offset_blade")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "offset_blade" %}
    {begin("5 of 8 - blade position")}
    {text("Move the toolhead toward the block until the BLADE just touches its flat side.")}
    {text("Current %s: %.2f" % (axis, th.position[ai]))}
    {jog_rows("offset_blade", axis, sign)}
    {button("Blade touches the block", "AUTO_EJECT_SETUP STEP=save_blade")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "save_blade" %}
    {wset("a_blade", "%.3f" % th.position[ai])}
    RESPOND TYPE=command MSG="action:prompt_end"
    G90
    G1 Z{[th.position[2] + 40.0, 40.0]|max} F{s.z_speed}
    M400
    AUTO_EJECT_SETUP STEP=offset_nozzle

  {% elif step == "offset_nozzle" %}
    {begin("5 of 8 - blade position")}
    {text("The toolhead was raised. Now move it until the NOZZLE TIP is right above the same flat side of the block. Look from the side.")}
    {text("Current %s: %.2f" % (axis, th.position[ai]))}
    {jog_rows("offset_nozzle", axis, sign)}
    {button("Nozzle is above the side", "AUTO_EJECT_SETUP STEP=save_nozzle")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "save_nozzle" %}
    {% set off = (th.position[ai] - w.a_blade) * sign %}
    {% if off < 1.0 or off > 200.0 %}
      {begin("5 of 8 - blade position")}
      {text("That gives a blade offset of %.1f mm, which does not look right. The blade face should be in front of the nozzle, toward the drop edge." % off)}
      {button("Measure again", "AUTO_EJECT_SETUP STEP=offset_intro", "warning")}
      {footer(cancel_label, cancel_gcode)}
      {show()}
    {% else %}
      {wset("blade_offset", "%.1f" % off)}
      AUTO_EJECT_SETUP STEP=width
    {% endif %}

  # ------------------------------------------------------------------ width
  {% elif step == "width" %}
    {begin("6 of 8 - blade width")}
    {text("Blade offset measured: %.1f mm." % w.blade_offset)}
    {text("Now set the blade width, across the push direction. If the blade is not centred on the nozzle, use twice the distance from the nozzle to the shorter side.")}
    {text("Width: %.0f mm" % w.blade_width)}
    {group_start()}
    {button("-10", "AUTO_EJECT_SETUP STEP=set_width VALUE=%.0f" % (w.blade_width - 10), "secondary")}
    {button("-1", "AUTO_EJECT_SETUP STEP=set_width VALUE=%.0f" % (w.blade_width - 1), "secondary")}
    {button("+1", "AUTO_EJECT_SETUP STEP=set_width VALUE=%.0f" % (w.blade_width + 1), "secondary")}
    {button("+10", "AUTO_EJECT_SETUP STEP=set_width VALUE=%.0f" % (w.blade_width + 10), "secondary")}
    {group_end()}
    {button("Save width", "AUTO_EJECT_SETUP STEP=edge")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "set_width" %}
    {wset("blade_width", [[value|float, 10.0]|max, 400.0]|min)}
    AUTO_EJECT_SETUP STEP=width

  # ------------------------------------------------------------------- edge
  {% elif step == "edge" %}
    {begin("7 of 8 - drop edge check")}
    {text("Remove the block. The toolhead moves to the %s edge and lowers the blade to the saved height." % w.direction)}
    {button("Bed is clear - move", "AUTO_EJECT_SETUP STEP=edge_go")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "edge_go" %}
    RESPOND TYPE=command MSG="action:prompt_end"
    _AUTO_EJECT_SETUP_EDGE

  {% elif step == "edge_check" %}
    {begin("7 of 8 - drop edge check")}
    {text("Look at the blade. Is its pushing face past the edge of the build surface?")}
    {text("If not, parts would stop on the edge of the bed instead of falling.")}
    {button("Yes, it is past the edge", "AUTO_EJECT_SETUP STEP=current")}
    {button("No", "AUTO_EJECT_SETUP STEP=edge_no", "warning")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "edge_no" %}
    {begin("7 of 8 - drop edge check")}
    {text("The blade needs to reach further. Lengthen its reach in front of the nozzle (blade_reach in hardware/plow.scad), then run the setup again.")}
    {text("You can continue anyway, but parts may stay on the edge of the bed.")}
    {button("Continue anyway", "AUTO_EJECT_SETUP STEP=current", "warning")}
    {footer("Close", cancel_gcode)}
    {show()}

  # ---------------------------------------------------------------- current
  {% elif step == "current" %}
    {% set ns = namespace(min=99.0, found=[]) %}
    {% for st in w.steppers.split(",") %}
      {% for kind in ["tmc2130", "tmc2208", "tmc2209", "tmc2240", "tmc2660", "tmc5160", "tmc5262"] %}
        {% if (kind ~ " " ~ st|trim) in cfg %}
          {% set rc = cfg[kind ~ " " ~ st|trim].run_current %}
          {% set ns.found = ns.found + ["%s %.2f A" % (st|trim, rc)] %}
          {% if rc < ns.min %}{% set ns.min = rc %}{% endif %}
        {% endif %}
      {% endfor %}
    {% endfor %}
    {% if value == "" and ns.min < 99.0 %}
      {wset("push_current", "%.2f" % (ns.min * 0.6))}
      AUTO_EJECT_SETUP STEP=current VALUE=shown
    {% else %}
      {begin("8 of 8 - current and cooling")}
      {text("While pushing, motor current is lowered so a part that will not move makes the motor skip instead of breaking anything.")}
      {text("Drivers: %s" % (ns.found|join(", ") if ns.found else "no TMC drivers found, current will not be changed"))}
      {text("Push current: %.2f A" % w.push_current)}
      {group_start()}
      {button("-0.1 A", "AUTO_EJECT_SETUP STEP=set_current VALUE=%.2f" % (w.push_current - 0.1), "secondary")}
      {button("+0.1 A", "AUTO_EJECT_SETUP STEP=set_current VALUE=%.2f" % (w.push_current + 0.1), "secondary")}
      {group_end()}
      {text("Before pushing, wait until: %s" % (("the bed is below %d C" % w.cool_temp) if w.cool_mode == "temperature" else ("%d minutes have passed" % (w.cool_time / 60)) if w.cool_mode == "time" else "no wait"))}
      {group_start()}
      {button("25 C", "AUTO_EJECT_SETUP STEP=set_cool VALUE=25", "secondary")}
      {button("28 C", "AUTO_EJECT_SETUP STEP=set_cool VALUE=28", "secondary")}
      {button("32 C", "AUTO_EJECT_SETUP STEP=set_cool VALUE=32", "secondary")}
      {button("10 min", "AUTO_EJECT_SETUP STEP=set_cool VALUE=time", "secondary")}
      {group_end()}
      {button("Next", "AUTO_EJECT_SETUP STEP=summary")}
      {footer(cancel_label, cancel_gcode)}
      {show()}
    {% endif %}

  {% elif step == "set_current" %}
    {wset("push_current", "%.2f" % [[value|float, 0.1]|max, 3.0]|min)}
    AUTO_EJECT_SETUP STEP=current VALUE=shown

  {% elif step == "set_cool" %}
    {% if value == "time" %}
      {wset_str("cool_mode", "time")}
      {wset("cool_time", 600)}
    {% else %}
      {wset_str("cool_mode", "temperature")}
      {wset("cool_temp", value|int)}
    {% endif %}
    AUTO_EJECT_SETUP STEP=current VALUE=shown

  # ---------------------------------------------------------------- summary
  {% elif step == "summary" %}
    {begin("summary")}
    {text("Drop edge: %s" % w.direction)}
    {text("Blade height (push_z): %.2f mm" % w.push_z)}
    {text("Blade offset: %.1f mm, width: %.0f mm" % (w.blade_offset, w.blade_width))}
    {text("Push current: %.2f A on %s" % (w.push_current, w.steppers))}
    {text("Cooling: %s" % (("bed below %d C" % w.cool_temp) if w.cool_mode == "temperature" else "%d s" % w.cool_time))}
    {button("Save", "AUTO_EJECT_SETUP STEP=save")}
    {button("Start over", "AUTO_EJECT_SETUP STEP=direction", "secondary")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "save" %}
    {% set vals = [["direction", w.direction], ["current_steppers", w.steppers], ["push_z", w.push_z], ["blade_offset", w.blade_offset], ["blade_width", w.blade_width], ["push_current", w.push_current], ["cool_mode", w.cool_mode], ["cool_temp", w.cool_temp], ["cool_time", w.cool_time]] %}
    {% for kv in vals %}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_SETTINGS VARIABLE={kv[0]} VALUE='{kv[1]|tojson}'
      {% if "save_variables" in printer %}
        SAVE_VARIABLE VARIABLE=auto_eject_{kv[0]} VALUE='{kv[1]|tojson}'
      {% endif %}
    {% endfor %}
    {begin("saved")}
    {% if "save_variables" in printer %}
      {text("Settings saved. They stay after a restart and override auto_eject_settings.cfg.")}
    {% else %}
      {text("Settings applied until the next restart. To keep them, copy these values into auto_eject_settings.cfg (text values in double quotes):")}
      {% for kv in vals %}
        {text("variable_%s: %s" % (kv[0], kv[1]))}
      {% endfor %}
    {% endif %}
    {text("Next: watch a dry run over the whole bed. The toolhead stays at a safe height and nothing is lowered.")}
    {button("Run dry test", "AUTO_EJECT_SETUP STEP=dry")}
    {footer("Finish", "AUTO_EJECT_SETUP STEP=done", "primary")}
    {show()}

  {% elif step == "dry" %}
    RESPOND TYPE=command MSG="action:prompt_end"
    AUTO_EJECT DRY=1 STRATEGY=full_width
    AUTO_EJECT_SETUP STEP=done

  {% elif step == "done" %}
    {begin("done")}
    {text("Setup complete.")}
    {text("1. After your next print, leave the parts on the bed and run AUTO_EJECT while you watch.")}
    {text("2. Then add AUTO_EJECT to your slicer end G-code, before your end macro.")}
    {text("3. For back-to-back printing, enable the Moonraker job queue (docs/integration.md).")}
    {footer("Close", cancel_gcode, "primary")}
    {show()}

  # ------------------------------------------------------------------ reset
  {% elif step == "reset" %}
    {% if "save_variables" in printer %}
      {% for key in printer.save_variables.variables %}
        {% if key.startswith("auto_eject_") %}
          SAVE_VARIABLE VARIABLE={key} VALUE=None
        {% endif %}
      {% endfor %}
    {% endif %}
    {action_respond_info("AUTO_EJECT_SETUP: saved values cleared. Run FIRMWARE_RESTART to use auto_eject_settings.cfg again.")}

  {% elif step == "close" %}
    RESPOND TYPE=command MSG="action:prompt_end"

  {% else %}
    {action_raise_error("AUTO_EJECT_SETUP: unknown STEP '%s'" % step)}
  {% endif %}


[gcode_macro _AUTO_EJECT_JOG]
description: Jog helper for AUTO_EJECT_SETUP
gcode:
  {% set axis = params.AXIS|upper %}
  {% set dist = params.DIST|float %}
  {% set th = printer.toolhead %}
  {% if axis not in ["X", "Y", "Z"] %}
    {action_raise_error("AUTO_EJECT_SETUP: bad axis '%s'" % axis)}
  {% endif %}
  {% if "xyz" not in th.homed_axes|lower %}
    {action_raise_error("AUTO_EJECT_SETUP: printer is not homed")}
  {% endif %}
  {% set i = {"X": 0, "Y": 1, "Z": 2}[axis] %}
  {% set lo = 0.5 if axis == "Z" else th.axis_minimum[i] %}
  {% set target = [[th.position[i] + dist, lo]|max, th.axis_maximum[i]]|min %}
  G90
  G1 {axis}{"%.3f" % target} F{600 if axis == "Z" else 1800}
  M400
  AUTO_EJECT_SETUP STEP={params.NEXT}

[gcode_macro _AUTO_EJECT_SETUP_CENTER]
gcode:
  {% set th = printer.toolhead %}
  G90
  G1 Z20 F600
  G1 X{(th.axis_minimum[0] + th.axis_maximum[0]) / 2.0} Y{(th.axis_minimum[1] + th.axis_maximum[1]) / 2.0} F6000
  G1 Z5 F600
  M400
  AUTO_EJECT_SETUP STEP=height

[gcode_macro _AUTO_EJECT_SETUP_EDGE]
gcode:
  {% set w = printer["gcode_macro _AUTO_EJECT_WIZARD"] %}
  {% set th = printer.toolhead %}
  {% set ai = 1 if w.direction in ["front", "back"] else 0 %}
  {% set sign = -1 if w.direction in ["front", "left"] else 1 %}
  {% set edge = th.axis_minimum[ai] if sign < 0 else th.axis_maximum[ai] %}
  G90
  G1 Z20 F600
  {% if ai == 1 %}
    G1 X{(th.axis_minimum[0] + th.axis_maximum[0]) / 2.0} Y{edge} F3000
  {% else %}
    G1 X{edge} Y{(th.axis_minimum[1] + th.axis_maximum[1]) / 2.0} F3000
  {% endif %}
  G1 Z{w.push_z} F300
  M400
  AUTO_EJECT_SETUP STEP=edge_check
