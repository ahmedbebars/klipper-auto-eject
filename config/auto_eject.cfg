variable_nozzle_clearance: 5.0
variable_verify_unsafe_action: "error"
variable_purge_length: 30.0      # mm of filament
variable_purge_height: 6.0       # pellet height in mm
variable_purge_start_z: 0.4
variable_purge_flow: 8.0         # mm^3/s
variable_purge_retract: 0.8
variable_purge_gap: 15.0         # distance in front of the nearest part
variable_purge_edge_margin: 50.0 # keep the pellet this far from the drop edge
variable_filament_diameter: 1.75
gcode:

[gcode_macro _AUTO_EJECT_OVERRIDES]
variable_data: {}
gcode:


#####################################################################
# Probe detection
#
# Contact probes ([probe], [bltouch], Voron Tap ...) touch whatever is
# under them, so they can find leftover parts. Eddy-current probes
# (probe_eddy_current, beacon, cartographer, scanner, probe_eddy_ng) sense
# the metal bed THROUGH plastic: Z is still correct, but they cannot see a
# part left on the bed unless a contact/touch mode is configured.
#####################################################################

[gcode_macro _AUTO_EJECT_PROBE]
variable_section: ""
variable_kind: "none"
variable_x: 0.0
variable_y: 0.0
variable_z: 0.0
gcode:

[gcode_macro _AUTO_EJECT_PROBE_INFO]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set raw = printer.configfile.config %}
  {% set cfg = printer.configfile.settings %}
  {% set ns = namespace(sec="", kind="none") %}
  {% for name in raw %}
    {% if ns.sec == "" and name in ["probe", "bltouch"] %}
      {% set ns.sec = name %}
      {% set ns.kind = "contact" %}
    {% endif %}
  {% endfor %}
  {% for name in raw %}
    {% if ns.sec == "" and (name.startswith("probe_eddy_current") or name.startswith("probe_eddy_ng") or name in ["beacon", "cartographer", "scanner"]) %}
      {% set ns.sec = name %}
      {% set ns.kind = "eddy" %}
    {% endif %}
  {% endfor %}
  {% if ns.sec != "" and s.probe_type in ["contact", "eddy"] %}
    {% set ns.kind = s.probe_type %}
  {% endif %}
  {% set o = cfg[ns.sec] if ns.sec in cfg else {} %}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_PROBE VARIABLE=section VALUE='"{ns.sec}"'
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_PROBE VARIABLE=kind VALUE='"{ns.kind}"'
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_PROBE VARIABLE=x VALUE={o.x_offset|default(0.0)|float}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_PROBE VARIABLE=y VALUE={o.y_offset|default(0.0)|float}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_PROBE VARIABLE=z VALUE={o.z_offset|default(0.0)|float}


#####################################################################
# AUTO_EJECT - entry point
#
# A thin wrapper so the steps render in order (Klipper renders a whole
# macro before running it, and macros cannot call themselves):
#   1. capture the current print's objects (unless SOURCE=saved)
#   2. smart home if HOME=1 and the printer is not homed
#   3. _AUTO_EJECT_RUN     cool down and sweep
#   4. _AUTO_EJECT_AFTER   re-home X/Y, then probe where the parts were
#   5. _AUTO_EJECT_RETRY   push any part still there again, lower and
#                          with more current (at most twice)
#   6. _AUTO_EJECT_FINISH  stop the queue if a part is left, otherwise
#                          forget the stored parts
#####################################################################

[gcode_macro AUTO_EJECT]
description: Push finished parts off the bed. Usage: AUTO_EJECT [STRATEGY=columns|objects|full_width] [DRY=1] [COOL=0] [VERIFY=0] [HOME=1] [SOURCE=saved] [HEIGHT=<print height>]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% set saved = params.SOURCE|default("live")|lower == "saved" %}
  # Print height: from the slicer (HEIGHT=[max_layer_z]) or as tracked
  # while printing. 0 means unknown.
  {% set h = params.HEIGHT|default(st.height)|float %}
  {% set thin = h > 0 and h < s.min_part_height and s.thin_parts_action|lower == "ignore" and params.DRY|default(0)|int != 1 %}
  {% if thin and saved %}
    {action_raise_error("AUTO_EJECT: the parts left from the last print are only %.1f mm tall, too thin to push. Remove them by hand, then run AUTO_EJECT_CLEAR." % h)}
  {% elif thin %}
    _AUTO_EJECT_LEAVE HEIGHT={h}
  {% else %}
    _AUTO_EJECT_PROBE_INFO
    {% if not saved %}
      _AUTO_EJECT_CAPTURE
    {% endif %}
    {% if params.HOME|default(0)|int == 1 and "xyz" not in printer.toolhead.homed_axes|lower %}
      _AUTO_EJECT_HOME
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=leftover VALUE='[]'
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=swept VALUE=False
    # The height tracker must not mistake our own moves for the print.
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=busy VALUE=True
    {% if params.HEIGHT|default(0)|float > 0 %}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=height VALUE={params.HEIGHT|float}
    {% endif %}
    _AUTO_EJECT_RUN {rawparams}
    _AUTO_EJECT_AFTER {rawparams}
    _AUTO_EJECT_RETRY ATTEMPT=1 {rawparams}
    _AUTO_EJECT_RETRY_2 ATTEMPT=2 {rawparams}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=busy VALUE=False
    _AUTO_EJECT_FINISH {rawparams}
  {% endif %}

# Stencils, flat signs and other parts too thin for the blade to catch:
# leave them on the bed, forget them, and hold the job queue so nothing
# is printed on top until someone takes them off.
[gcode_macro _AUTO_EJECT_LEAVE]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set h = params.HEIGHT|float %}
  {action_respond_info("AUTO_EJECT: the parts are only %.1f mm tall (min_part_height %.1f), too thin to push. They stay on the bed for you to remove." % (h, s.min_part_height))}
  {% if s.thin_pause_queue %}
    {action_call_remote_method("pause_job_queue")}
    {action_respond_info("AUTO_EJECT: job queue paused until the bed is clear (AUTO_EJECT_CONTINUE)")}
  {% endif %}
  _AUTO_EJECT_CLEAR_STATE
  {% if "respond" in printer.configfile.config %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Auto-eject - remove the parts"
    RESPOND TYPE=command MSG="action:prompt_text This print is only {"%.1f" % h} mm tall, too thin for the blade, so it was left on the bed. Take it off by hand."
    {% if s.thin_pause_queue %}
      RESPOND TYPE=command MSG="action:prompt_text The job queue waits until you confirm the bed is clear."
      RESPOND TYPE=command MSG="action:prompt_footer_button Bed is clear - continue the queue|AUTO_EJECT_CONTINUE|primary"
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_footer_button Bed is clear|AUTO_EJECT_CONTINUE|primary"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro AUTO_EJECT_CONTINUE]
description: The bed is clear: close the dialog and start the job queue again
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% if "respond" in printer.configfile.config %}
    RESPOND TYPE=command MSG="action:prompt_end"
  {% endif %}
  {% if s.thin_pause_queue %}
    {action_call_remote_method("start_job_queue")}
    {action_respond_info("AUTO_EJECT: job queue started")}
  {% endif %}


[gcode_macro _AUTO_EJECT_RUN]
description: Cool down and sweep (one pass)
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% set th = printer.toolhead %}
  {% set cfg = printer.configfile.settings %}
  {% set strategy = params.STRATEGY|default(s.strategy)|lower %}
  {% set dry = params.DRY|default(0)|int == 1 %}
  {% set only_leftover = params.ONLY|default("")|lower == "leftover" %}
  {% set push_z = params.PUSH_Z|default(s.push_z)|float %}
  {% set push_current = params.CURRENT|default(s.push_current)|float %}
  {% set do_cool = params.COOL|default(1)|int == 1 and not dry %}
  {% set direction = s.direction|lower %}

  # ------------------------------------------------------------------
  # Sanity checks
  # ------------------------------------------------------------------
  {% if strategy not in ["columns", "objects", "full_width"] %}
    {action_raise_error("AUTO_EJECT: unknown STRATEGY '%s' (use columns, objects or full_width)" % strategy)}
  {% endif %}
  {% if direction not in ["front", "back", "left", "right"] %}
    {action_raise_error("AUTO_EJECT: unknown direction '%s' in _AUTO_EJECT_SETTINGS (use front, back, left or right)" % direction)}
  {% endif %}
  {% if "xyz" not in th.homed_axes|lower %}
    {action_raise_error("AUTO_EJECT: printer is not homed. Run AUTO_EJECT HOME=1 to home safely around the parts, or remove them by hand.")}
  {% endif %}

  # ------------------------------------------------------------------
  # Axis set-up. "a" is the push axis, "c" the cross axis.
  # d = distance measured AGAINST the push direction, so parts that are
  # further from the drop edge have a larger d.
  # ------------------------------------------------------------------
  {% set ai = 1 if direction in ["front", "back"] else 0 %}
  {% set ci = 1 - ai %}
  {% set sign = -1 if direction in ["front", "left"] else 1 %}
  {% set a_lo = th.axis_minimum[ai] %}
  {% set a_hi = th.axis_maximum[ai] %}
  {% set c_lo = th.axis_minimum[ci] %}
  {% set c_hi = th.axis_maximum[ci] %}
  {% if s.push_end is string %}
    {% set a_end = a_lo if sign < 0 else a_hi %}
  {% else %}
    {% set a_end = s.push_end|float %}
  {% endif %}
  {% set d_far = -sign * (a_hi if sign < 0 else a_lo) %}
  {% set half = s.blade_width / 2.0 %}
  {% set step = s.blade_width - s.column_overlap %}
  {% set zsafe = [th.position[2] + s.z_hop, s.min_safe_z, st.height + s.z_hop]|max %}

  # ------------------------------------------------------------------
  # Object boxes in push coordinates: [d_min, d_max, c_min, c_max, name]
  # Records come from _AUTO_EJECT_STATE: [name, x0, x1, y0, y1, ...]
  # ------------------------------------------------------------------
  {% set ns = namespace(boxes=[], cmin=999999.0, cmax=-999999.0) %}
  {% for r in st.objects if not only_leftover or r[0] in st.leftover %}
    {% set a0 = r[1 + 2 * ai] %}
    {% set a1 = r[2 + 2 * ai] %}
    {% set c0 = r[1 + 2 * ci] %}
    {% set c1 = r[2 + 2 * ci] %}
    {% set d0 = [-sign * a0, -sign * a1]|min %}
    {% set d1 = [-sign * a0, -sign * a1]|max %}
    {% set ns.boxes = ns.boxes + [[d0, d1, c0, c1, r[0]]] %}
    {% if c0 < ns.cmin %}{% set ns.cmin = c0 %}{% endif %}
    {% if c1 > ns.cmax %}{% set ns.cmax = c1 %}{% endif %}
  {% endfor %}

  {% if ns.boxes|length == 0 and strategy != "full_width" %}
    {% if s.no_objects_action == "full_width" %}
      {action_respond_info("AUTO_EJECT: no labelled objects found, falling back to a full-width sweep")}
      {% set strategy = "full_width" %}
    {% elif s.no_objects_action == "error" %}
      {action_raise_error("AUTO_EJECT: no labelled objects found. Enable 'Label objects' / 'Exclude objects' in your slicer.")}
    {% else %}
      {action_respond_info("AUTO_EJECT: no labelled objects found, nothing to do")}
      {% set strategy = "skip" %}
    {% endif %}
  {% endif %}

  {% if strategy != "skip" %}
    {action_respond_info("AUTO_EJECT: strategy=%s direction=%s objects=%d safe_z=%.1f%s" % (strategy, direction, ns.boxes|length, zsafe, " [DRY RUN]" if dry else ""))}

    # ----------------------------------------------------------------
    # Build the list of pushes: [c, d_start]
    # ----------------------------------------------------------------
    {% set pushes = namespace(list=[], clamped=False) %}
    {% if strategy == "objects" %}
      {% set sorted_boxes = ns.boxes|sort(attribute="0") %}
      {% for bx in sorted_boxes %}
        {% set i = loop.index0 %}
        {% set c = (bx[2] + bx[3]) / 2.0 %}
        {% set d_start = bx[1] + s.rear_clearance + s.blade_offset %}
        {% for other in sorted_boxes %}
          {% if loop.index0 > i %}
            {% if other[3] > c - half - s.side_margin and other[2] < c + half + s.side_margin and other[1] > bx[1] and other[0] < d_start + s.head_depth %}
              {action_raise_error("AUTO_EJECT: '%s' sits where the blade must come down behind '%s'. Leave more space between parts or use STRATEGY=columns." % (other[4], bx[4]))}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% set pushes.list = pushes.list + [[c, d_start]] %}
      {% endfor %}
    {% else %}
      {% if strategy == "full_width" %}
        {% set r_lo = c_lo + half - s.column_overlap / 2.0 %}
        {% set r_hi = c_hi %}
      {% else %}
        {% set r_lo = ns.cmin + half - s.column_overlap / 2.0 %}
        {% set r_hi = ns.cmax %}
      {% endif %}
      {% for k in range(0, 100) %}
        {% set c = r_lo + k * step %}
        {% if c - half < r_hi %}
          {% set col = namespace(dmax=-999999.0) %}
          {% for bx in ns.boxes %}
            {% if bx[3] > c - half and bx[2] < c + half and bx[1] > col.dmax %}
              {% set col.dmax = bx[1] %}
            {% endif %}
          {% endfor %}
          {% if strategy == "full_width" %}
            {% set pushes.list = pushes.list + [[c, d_far]] %}
          {% elif col.dmax > -999999.0 %}
            {% set pushes.list = pushes.list + [[c, col.dmax + s.rear_clearance + s.blade_offset]] %}
          {% endif %}
        {% endif %}
      {% endfor %}
    {% endif %}

    # check the start points are reachable
    {% for p in pushes.list %}
      {% if p[1] > d_far + 0.001 %}{% set pushes.clamped = True %}{% endif %}
    {% endfor %}
    {% if pushes.clamped and not dry and not s.allow_clamped_start %}
      {action_raise_error("AUTO_EJECT: a part is too close to the far edge of the bed: the blade cannot get behind it. Move parts away from that edge, or set allow_clamped_start: True.")}
    {% endif %}

    # ----------------------------------------------------------------
    # Cool down
    # ----------------------------------------------------------------
    {% if do_cool %}
      {% if s.heaters_off %}
        M104 S0
        {% if "heater_bed" in printer %}M140 S0{% endif %}
      {% endif %}
      {% if s.cool_fan_speed > 0 %}
        M106 S{(s.cool_fan_speed * 255)|round|int}
      {% endif %}
      G90
      G1 Z{zsafe} F{s.z_speed}
      {% set wait = (s.cool_mode == "temperature" and "heater_bed" in printer) or s.cool_mode == "time" %}
      {% set tour = wait and s.cool_tour and s.cool_fan_speed > 0 and st.objects|length > 0 %}
      {% if s.cool_mode == "temperature" and "heater_bed" in printer %}
        {action_respond_info("AUTO_EJECT: waiting for the bed to reach %.0f C%s" % (s.cool_temp, ", fan over the parts" if tour else ""))}
      {% elif s.cool_mode == "time" %}
        {action_respond_info("AUTO_EJECT: waiting %d s for parts to cool%s" % (s.cool_time, ", fan over the parts" if tour else ""))}
      {% endif %}
      {% if tour %}
        # Each pass checks again whether cooling is done, so the toolhead
        # keeps circling only as long as needed (at most 120 passes).
        SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=cool_start VALUE={th.estimated_print_time|default(0.0)}
        {% for _ in range(120) %}
          _AUTO_EJECT_COOL_PASS
        {% endfor %}
        G90
        G1 Z{zsafe} F{s.z_speed}
      {% endif %}
      {% if s.cool_mode == "temperature" and "heater_bed" in printer %}
        TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM={s.cool_temp}
      {% elif s.cool_mode == "time" and tour %}
        _AUTO_EJECT_COOL_REST
      {% elif s.cool_mode == "time" %}
        G4 P{(s.cool_time * 1000)|int}
      {% endif %}
    {% endif %}

    # ----------------------------------------------------------------
    # Lower motor current on the push steppers
    # ----------------------------------------------------------------
    {% set drv = namespace(list=[]) %}
    {% if s.reduce_current and not dry %}
      {% for stp in s.current_steppers.split(",") %}
        {% set stp = stp|trim|lower %}
        {% for kind in ["tmc2130", "tmc2208", "tmc2209", "tmc2240", "tmc2660", "tmc5160", "tmc5262"] %}
          {% if (kind ~ " " ~ stp) in cfg %}
            {% set drv.list = drv.list + [[stp, cfg[kind ~ " " ~ stp].run_current]] %}
          {% endif %}
        {% endfor %}
      {% endfor %}
    {% endif %}

    SAVE_GCODE_STATE NAME=_auto_eject
    G90
    SET_VELOCITY_LIMIT ACCEL={s.push_accel}
    {% for d in drv.list %}
      SET_TMC_CURRENT STEPPER={d[0]} CURRENT={push_current}
    {% endfor %}
    G1 Z{zsafe} F{s.z_speed}

    # ----------------------------------------------------------------
    # Push
    # ----------------------------------------------------------------
    {% for p in pushes.list %}
      {% set cc = [[p[0], c_lo]|max, c_hi]|min %}
      {% set a_start = [[-sign * [p[1], d_far]|min, a_lo]|max, a_hi]|min %}
      {% if ai == 1 %}
        G1 X{"%.3f" % cc} Y{"%.3f" % a_start} F{s.travel_speed}
      {% else %}
        G1 X{"%.3f" % a_start} Y{"%.3f" % cc} F{s.travel_speed}
      {% endif %}
      {% if dry %}
        G4 P{s.dry_pause}
        {% if ai == 1 %}G1 Y{"%.3f" % a_end} F{s.travel_speed}{% else %}G1 X{"%.3f" % a_end} F{s.travel_speed}{% endif %}
      {% else %}
        G1 Z{push_z} F{s.z_speed}
        {% if ai == 1 %}G1 Y{"%.3f" % a_end} F{s.push_speed}{% else %}G1 X{"%.3f" % a_end} F{s.push_speed}{% endif %}
      {% endif %}
      G1 Z{zsafe} F{s.z_speed}
    {% endfor %}
    M400

    # ----------------------------------------------------------------
    # Restore
    # ----------------------------------------------------------------
    {% for d in drv.list %}
      SET_TMC_CURRENT STEPPER={d[0]} CURRENT={d[1]}
    {% endfor %}
    SET_VELOCITY_LIMIT ACCEL={th.max_accel}
    {% if do_cool and s.cool_fan_speed > 0 %}M107{% endif %}
    RESTORE_GCODE_STATE NAME=_auto_eject

    {action_respond_info("AUTO_EJECT: %s finished (%d push%s)" % ("dry run" if dry else "sweep", pushes.list|length, "" if pushes.list|length == 1 else "es"))}
    {% if not dry %}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=swept VALUE=True
    {% endif %}
  {% endif %}


# One cooling pass: hover over every part with the part fan blowing on it.
# Does nothing once the bed is cool enough (or cool_time has passed).
[gcode_macro _AUTO_EJECT_COOL_PASS]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% set th = printer.toolhead %}
  {% if s.cool_mode == "temperature" %}
    {% set more = "heater_bed" in printer and printer.heater_bed.temperature > s.cool_temp %}
  {% else %}
    {% set more = th.estimated_print_time|default(0.0) - st.cool_start < s.cool_time %}
  {% endif %}
  {% if more %}
    # just above the tallest part; nothing below min_safe_z if the height
    # is unknown, and a blade hanging below the nozzle is allowed for
    {% set low = 0.0 - s.blade_lift if s.blade_lift is number else 0.0 %}
    {% set z = (st.height + s.cool_tour_gap if st.height > 0 else [s.min_safe_z, s.cool_tour_gap]|max) + [low, 0.0]|max %}
    G90
    G1 Z{"%.2f" % z} F{s.z_speed}
    {% for r in st.objects %}
      G1 X{"%.2f" % r[5]} Y{"%.2f" % r[6]} F{s.travel_speed}
      G4 P{(s.cool_tour_dwell * 1000)|int}
    {% endfor %}
    M400
  {% endif %}

# Time mode: wait out whatever is left of cool_time after the passes.
[gcode_macro _AUTO_EJECT_COOL_REST]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set left = s.cool_time - (printer.toolhead.estimated_print_time|default(0.0) - printer["gcode_macro _AUTO_EJECT_STATE"].cool_start) %}
  {% if left > 0 %}
    G4 P{(left * 1000)|int}
  {% endif %}

[gcode_macro _AUTO_EJECT_AFTER]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% set do_verify = params.VERIFY|default(1 if s.verify else 0)|int == 1 %}
  {% if st.swept %}
    {% if s.rehome_xy %}
      # A part that would not move makes the motor skip on purpose. Home X
      # and Y again (they never touch the bed) so the position is exact.
      _AUTO_EJECT_REHOME
    {% endif %}
    {% if do_verify and st.objects|length > 0 %}
      _AUTO_EJECT_VERIFY ONLY={params.ONLY|default("all")}
    {% endif %}
  {% endif %}

[gcode_macro _AUTO_EJECT_REHOME]
gcode:
  {action_respond_info("AUTO_EJECT: re-homing X and Y")}
  G28 X Y
  _AUTO_EJECT_ENSURE_Z

[gcode_macro _AUTO_EJECT_ENSURE_Z]
gcode:
  # Some homing macros un-home Z while homing X/Y: find Z again around the parts.
  {% if "z" not in printer.toolhead.homed_axes|lower %}
    _AUTO_EJECT_HOME
  {% endif %}

[gcode_macro _AUTO_EJECT_RETRY]
description: Push again any part the probe found still on the bed
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% set attempt = params.ATTEMPT|default(1)|int %}
  {% if params.DRY|default(0)|int != 1 and st.leftover|length > 0 and attempt <= [s.retries, 2]|min %}
    {% set run_current = namespace(v=9.0) %}
    {% set cfg = printer.configfile.settings %}
    {% for stp in s.current_steppers.split(",") %}
      {% for kind in ["tmc2130", "tmc2208", "tmc2209", "tmc2240", "tmc2660", "tmc5160", "tmc5262"] %}
        {% if (kind ~ " " ~ stp|trim|lower) in cfg and cfg[kind ~ " " ~ stp|trim|lower].run_current < run_current.v %}
          {% set run_current.v = cfg[kind ~ " " ~ stp|trim|lower].run_current %}
        {% endif %}
      {% endfor %}
    {% endfor %}
    {% set floor = [s.push_z_min, 0.2 - s.blade_lift]|max if s.blade_lift is number else s.push_z_min %}
    {% set z = [[s.push_z - s.retry_z_step * attempt, floor]|max, s.push_z]|min %}
    {% set cur = [[s.push_current + s.retry_current_step * attempt, run_current.v]|min, s.push_current]|max %}
    {action_respond_info("AUTO_EJECT: retry %d for %s (push Z %.2f, current %.2f A)" % (attempt, st.leftover|join(", "), z, cur))}
    _AUTO_EJECT_RUN ONLY=leftover COOL=0 PUSH_Z={z} CURRENT={cur} STRATEGY={params.STRATEGY|default(s.strategy)}
    _AUTO_EJECT_AFTER ONLY=leftover
  {% endif %}

[gcode_macro _AUTO_EJECT_RETRY_2]
gcode:
  _AUTO_EJECT_RETRY {rawparams}

[gcode_macro _AUTO_EJECT_FINISH]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% set dry = params.DRY|default(0)|int == 1 %}
  {% set n = [s.retries, 2]|min %}
  {% if not dry %}
    {% if st.leftover|length > 0 %}
      {action_raise_error("AUTO_EJECT: '%s' %s STILL ON THE BED%s. Stopping so the next job does not start. Remove it, then run AUTO_EJECT_CLEAR." % (st.leftover|join("', '"), "is" if st.leftover|length == 1 else "are", "" if n == 0 else " after %d retr%s" % (n, "y" if n == 1 else "ies")))}
    {% else %}
      _AUTO_EJECT_CLEAR_STATE
    {% endif %}
  {% endif %}


#####################################################################
# Verification with the probe
#####################################################################

[gcode_macro _AUTO_EJECT_VERIFY]
description: Probe where the parts were; stop with an error if any is still there
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% set pb = printer["gcode_macro _AUTO_EJECT_PROBE"] %}
  {% set th = printer.toolhead %}
  {% set only = params.ONLY|default("all")|lower == "leftover" %}
  {% set objs = namespace(list=[]) %}
  {% for r in st.objects if not only or r[0] in st.leftover %}
    {% set objs.list = objs.list + [r] %}
  {% endfor %}
  {% if pb.kind == "none" %}
    {action_respond_info("AUTO_EJECT: no probe found, the bed was NOT verified")}
  {% elif pb.kind == "eddy" and s.verify_probe_gcode|trim|upper == "PROBE" %}
    {action_respond_info("AUTO_EJECT: WARNING - eddy-current probes cannot see plastic parts, the bed was NOT verified. Set verify_probe_gcode to your probe contact or touch command to enable verification.")}
  {% else %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=leftover VALUE='[]'
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=abort VALUE=False
    # With an offset probe the nozzle hangs elsewhere while probing: never
    # let it come down over a spot where a part was.
    {% set offset = (pb.x * pb.x + pb.y * pb.y) ** 0.5 > 1.0 %}
    # Plan the probe points. With an offset probe the nozzle must never be
    # over a part that might still be there. A part already confirmed gone
    # is safe to pass over (once a part is found, the remaining points are
    # skipped), so parts are planned in the order that makes each one
    # reachable.
    {% set plan = namespace(done=[], steps=[]) %}
    {% for _pass in objs.list %}
      {% for r in objs.list %}
        {% set idx = loop.index0 %}
        {% if idx not in plan.done %}
          {% set inset = s.verify_inset %}
          {% set fallback = [[r[5], r[6]], [r[1] + inset, r[3] + inset], [r[2] - inset, r[3] + inset], [r[2] - inset, r[4] - inset], [r[1] + inset, r[4] - inset]] %}
          {% set primary = [[r[5], r[6]]] if s.verify_points == "center" else r[7] %}
          {% set want = primary|length %}
          {% set got = namespace(list=[]) %}
          {% for t in primary + fallback %}
            {% if got.list|length < want %}
              {% set nx = t[0] - pb.x %}
              {% set ny = t[1] - pb.y %}
              {% set ok = namespace(v=(nx >= th.axis_minimum[0] and nx <= th.axis_maximum[0] and ny >= th.axis_minimum[1] and ny <= th.axis_maximum[1])) %}
              {% if ok.v and offset %}
                {% for q in objs.list %}
                  {% if loop.index0 not in plan.done and nx > q[1] - s.nozzle_clearance and nx < q[2] + s.nozzle_clearance and ny > q[3] - s.nozzle_clearance and ny < q[4] + s.nozzle_clearance %}
                    {% set ok.v = False %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {% if ok.v and [nx, ny] not in got.list %}
                {% set got.list = got.list + [[nx, ny]] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if got.list|length > 0 %}
            {% set plan.done = plan.done + [idx] %}
            {% set plan.steps = plan.steps + [[r[0], got.list]] %}
          {% endif %}
        {% endif %}
      {% endfor %}
    {% endfor %}
    {% set n_pts = namespace(count=0, unsafe=[]) %}
    {% for r in objs.list %}
      {% if loop.index0 not in plan.done %}
        {% set n_pts.unsafe = n_pts.unsafe + [r[0]] %}
      {% endif %}
    {% endfor %}
    G90
    {% for step in plan.steps %}
      {% for t in step[1] %}
        {% set n_pts.count = n_pts.count + 1 %}
        _AUTO_EJECT_PROBE_AT X={"%.3f" % t[0]} Y={"%.3f" % t[1]} NAME="{step[0]}"
      {% endfor %}
    {% endfor %}
    G1 Z{s.verify_z} F{s.z_speed}
    {% if n_pts.unsafe|length > 0 %}
      {% if s.verify_unsafe_action == "skip" %}
        {action_respond_info("AUTO_EJECT: WARNING - could not probe %s without the nozzle passing over a part, NOT verified" % n_pts.unsafe|join(", "))}
      {% else %}
        {action_raise_error("AUTO_EJECT: could not probe %s without the nozzle passing over a part, so the bed is not confirmed clear. Check it by hand, then run AUTO_EJECT_CLEAR." % n_pts.unsafe|join(", "))}
      {% endif %}
    {% endif %}
    _AUTO_EJECT_VERIFY_REPORT POINTS={n_pts.count}
  {% endif %}

[gcode_macro _AUTO_EJECT_VERIFY_REPORT]
gcode:
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% if st.leftover|length == 0 %}
    {action_respond_info("AUTO_EJECT: bed verified clear (%d probe point%s)" % (params.POINTS|int, "" if params.POINTS|int == 1 else "s"))}
  {% else %}
    {action_respond_info("AUTO_EJECT: still on the bed: %s" % st.leftover|join(", "))}
  {% endif %}

[gcode_macro _AUTO_EJECT_PROBE_AT]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  # Skipped once a leftover part was found with an offset probe: the rest
  # of the plan assumed that part was gone, so the nozzle could hit it.
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% if not st.abort %}
    G90
    G1 Z{s.verify_z} F{s.z_speed}
    G1 X{params.X} Y{params.Y} F{s.travel_speed}
    {s.verify_probe_gcode}
    _AUTO_EJECT_CHECK NAME="{params.NAME}"
  {% elif params.NAME not in st.leftover %}
    {action_respond_info("AUTO_EJECT: '%s' not checked (the nozzle could hit the part found), counted as still there" % params.NAME)}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=leftover VALUE="{st.leftover + [params.NAME]}"
  {% endif %}


[gcode_macro _AUTO_EJECT_CHECK]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set pb = printer["gcode_macro _AUTO_EJECT_PROBE"] %}
  # last_z_result is the toolhead Z at the moment the probe triggered
  {% set z = printer.probe.last_z_result %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  # parts thinner than twice verify_threshold would pass unnoticed
  {% set threshold = [s.verify_threshold, [0.2, st.height * 0.5]|max]|min if st.height > 0 else s.verify_threshold %}
  {% set limit = pb.z + threshold %}
  {% set name = params.NAME|default("object") %}
  {% if z > limit %}
    G1 Z{s.verify_z} F{s.z_speed}
    {action_respond_info("AUTO_EJECT: '%s' found on the bed (probe hit at Z=%.2f, limit %.2f)" % (name, z, limit))}
    {% if name not in st.leftover %}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=leftover VALUE="{st.leftover + [name]}"
    {% endif %}
    {% if (pb.x * pb.x + pb.y * pb.y) ** 0.5 > 1.0 %}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=abort VALUE=True
    {% endif %}
  {% endif %}


#####################################################################
# Print state: object outlines and print height, kept across restarts
#
# Records: [name, x0, x1, y0, y1, cx, cy, [[x, y], [x, y], [x, y]]]
# The three points sit just inside the outline and are used to verify
# hollow parts. Saved in [save_variables] as auto_eject_objects and
# auto_eject_height, and cleared after a successful eject.
#####################################################################

[gcode_macro _AUTO_EJECT_STATE]
variable_objects: []
variable_height: 0.0
variable_job: ""
variable_last_duration: 0.0
variable_captured: False
variable_leftover: []
variable_abort: False
variable_swept: False
variable_cool_start: 0.0
variable_busy: False
gcode:

[gcode_macro _AUTO_EJECT_CAPTURE]
description: Store the current print's object outlines in _AUTO_EJECT_STATE
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set live = printer.exclude_object.objects if "exclude_object" in printer else [] %}
  {% if live|length > 0 %}
    {% set ns = namespace(recs=[]) %}
    {% for o in live %}
      {% set pts = o.polygon %}
      {% set n = pts|length %}
      {% if n > 0 %}
        {% set b = namespace(x0=999999.0, x1=-999999.0, y0=999999.0, y1=-999999.0) %}
        {% for p in pts %}
          {% if p[0] < b.x0 %}{% set b.x0 = p[0] %}{% endif %}
          {% if p[0] > b.x1 %}{% set b.x1 = p[0] %}{% endif %}
          {% if p[1] < b.y0 %}{% set b.y0 = p[1] %}{% endif %}
          {% if p[1] > b.y1 %}{% set b.y1 = p[1] %}{% endif %}
        {% endfor %}
        {% set cx = o.center[0] if o.center else (b.x0 + b.x1) / 2.0 %}
        {% set cy = o.center[1] if o.center else (b.y0 + b.y1) / 2.0 %}
        {% set vp = namespace(list=[]) %}
        {% for k in [0, (n / 3)|int, (2 * n / 3)|int] %}
          {% set p = pts[k] %}
          {% set dx = cx - p[0] %}
          {% set dy = cy - p[1] %}
          {% set dist = (dx * dx + dy * dy) ** 0.5 %}
          {% set f = (s.verify_inset / dist) if dist > s.verify_inset else 0.0 %}
          {% set vp.list = vp.list + [[(p[0] + dx * f)|round(2), (p[1] + dy * f)|round(2)]] %}
        {% endfor %}
        {% set name = o.name|replace("'", "")|replace('"', "") %}
        {% set ns.recs = ns.recs + [[name, b.x0|round(2), b.x1|round(2), b.y0|round(2), b.y1|round(2), cx|round(2), cy|round(2), vp.list]] %}
      {% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=objects VALUE='{ns.recs|tojson}'
    {% if s.persist_state and "save_variables" in printer %}
      SAVE_VARIABLE VARIABLE=auto_eject_objects VALUE='{ns.recs|tojson}'
    {% endif %}
  {% endif %}

[gcode_macro _AUTO_EJECT_CLEAR_STATE]
description: Forget the stored objects after a successful eject
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=objects VALUE='[]'
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=height VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=busy VALUE=False
  {% if s.persist_state and "save_variables" in printer %}
    SAVE_VARIABLE VARIABLE=auto_eject_objects VALUE='[]'
    SAVE_VARIABLE VARIABLE=auto_eject_height VALUE=0.0
  {% endif %}

[gcode_macro AUTO_EJECT_CLEAR]
description: Tell auto-eject the bed is clear (after removing parts by hand)
gcode:
  _AUTO_EJECT_CLEAR_STATE
  {action_respond_info("AUTO_EJECT: stored parts forgotten, the bed is treated as clear")}

[delayed_gcode _AUTO_EJECT_TRACK]
initial_duration: 10
gcode:
  _AUTO_EJECT_TRACK_STEP
  UPDATE_DELAYED_GCODE ID=_AUTO_EJECT_TRACK DURATION=30

[gcode_macro _AUTO_EJECT_TRACK_STEP]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% set ps = printer.print_stats %}
  {% set persist = s.persist_state and "save_variables" in printer %}
  {% set live = printer.exclude_object.objects if "exclude_object" in printer else [] %}
  {% if s.persist_state and ps.state == "printing" %}
    {% set new_job = ps.filename != st.job or ps.total_duration < st.last_duration %}
    {% set captured = st.captured and not new_job %}
    {% if new_job %}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=job VALUE='{ps.filename|tojson}'
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=captured VALUE=False
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=busy VALUE=False
    {% endif %}
    # Parts from an earlier print that were never ejected are kept until
    # AUTO_EJECT_GUARD (or AUTO_EJECT_CLEAR) deals with them.
    {% if not captured and st.objects|length == 0 and live|length > 0 %}
      _AUTO_EJECT_CAPTURE
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=captured VALUE=True
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=height VALUE=0.0
      {% if persist %}SAVE_VARIABLE VARIABLE=auto_eject_height VALUE=0.0{% endif %}
    {% elif captured %}
      # Slicers that report layers (SET_PRINT_STATS_INFO) set TOTAL_LAYER
      # before the start G-code and CURRENT_LAYER from the first layer on.
      # In between, homing and probing moves are not part of the height.
      {% set info = ps.info|default({}) %}
      {% set in_start = info.total_layer|default(none) is not none and info.current_layer|default(none) is none %}
      # A layer is at most 0.6 mm, so higher Z is a move of the end
      # G-code (parking) and not part of the print.
      {% set layer = info.current_layer|default(none) %}
      {% set cap = layer * 0.6 + 1.0 if layer is not none else 99999.0 %}
      {% set z = printer.toolhead.position[2] %}
      {% set on_disk = printer.save_variables.variables.auto_eject_height|default(0.0) if persist else 0.0 %}
      {% if not in_start and not st.busy and z > st.height and z <= cap %}
        SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=height VALUE={"%.2f" % z}
        {% if persist and (z > on_disk + 0.5 or on_disk == 0) %}SAVE_VARIABLE VARIABLE=auto_eject_height VALUE={"%.2f" % z}{% endif %}
      {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE=last_duration VALUE={ps.total_duration}
  {% endif %}


#####################################################################
# AUTO_EJECT_GUARD - put it first in the slicer's start G-code
#
# If the printer still remembers parts that were never ejected (power
# loss, restart, emergency stop), do not print on top of them:
#   guard_action "error" - stop the new print (default)
#   guard_action "eject" - home safely around the old parts, eject them
#                          and verify, then let the print continue
#####################################################################

[gcode_macro AUTO_EJECT_GUARD]
description: Stop or eject before printing if parts from an earlier print may still be on the bed
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% if st.objects|length > 0 %}
    {% if s.guard_action == "eject" %}
      {action_respond_info("AUTO_EJECT_GUARD: %d part(s) from an earlier print may still be on the bed, ejecting them first" % st.objects|length)}
      AUTO_EJECT HOME=1 SOURCE=saved
    {% else %}
      {action_raise_error("AUTO_EJECT_GUARD: %d part(s) from an earlier print may still be on the bed. Run AUTO_EJECT HOME=1 SOURCE=saved, or remove them and run AUTO_EJECT_CLEAR." % st.objects|length)}
    {% endif %}
  {% endif %}


#####################################################################
# Smart homing around the parts
#
# X and Y are homed normally (they never touch the bed). Z is measured
# with the probe at the free spot furthest from every stored part, so a
# part can never be mistaken for the bed.
#####################################################################

[gcode_macro _AUTO_EJECT_HOME]
gcode:
  _AUTO_EJECT_PROBE_INFO
  _AUTO_EJECT_HOME_CHECKED

[gcode_macro _AUTO_EJECT_HOME_CHECKED]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set cfg = printer.configfile.settings %}
  {% set raw = printer.configfile.config %}
  {% set method = s.home_method|lower %}
  {% if method == "auto" %}
    {% set zpin = (cfg.stepper_z.endstop_pin|default(""))|lower|replace(" ", "") %}
    {% set method = "probe" if "probe:z_virtual_endstop" in zpin else "refuse" %}
  {% endif %}
  {% if method == "refuse" %}
    {action_raise_error("AUTO_EJECT HOME=1: Z homes with a switch, so homing could touch a part. If that switch is off the bed, set home_method to g28.")}
  {% elif method == "g28" %}
    G28
  {% elif method == "probe" %}
    {% if "force_move" not in cfg or not cfg.force_move.enable_force_move %}
      {action_raise_error("AUTO_EJECT HOME=1 needs [force_move] with enable_force_move: True")}
    {% endif %}
    {% if printer["gcode_macro _AUTO_EJECT_PROBE"].kind == "none" %}
      {action_raise_error("AUTO_EJECT HOME=1 needs a Z probe")}
    {% endif %}
    {% if "x" not in printer.toolhead.homed_axes|lower or "y" not in printer.toolhead.homed_axes|lower %}
      G28 X Y
    {% endif %}
    _AUTO_EJECT_HOME_Z
  {% else %}
    {action_raise_error("AUTO_EJECT: unknown home_method '%s' (use auto, probe or g28)" % method)}
  {% endif %}

[gcode_macro _AUTO_EJECT_HOME_Z]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% set pb = printer["gcode_macro _AUTO_EJECT_PROBE"] %}
  {% set th = printer.toolhead %}
  # Candidate spots are probe positions. The nozzle sits at probe - offset,
  # and BOTH must stay clear of every stored part: the whole toolhead comes
  # down to a few mm above the bed while probing.
  {% set x_lo = [th.axis_minimum[0] + pb.x, th.axis_minimum[0]]|max + s.home_edge_margin %}
  {% set x_hi = [th.axis_maximum[0] + pb.x, th.axis_maximum[0]]|min - s.home_edge_margin %}
  {% set y_lo = [th.axis_minimum[1] + pb.y, th.axis_minimum[1]]|max + s.home_edge_margin %}
  {% set y_hi = [th.axis_maximum[1] + pb.y, th.axis_maximum[1]]|min - s.home_edge_margin %}
  {% set mx = (x_lo + x_hi) / 2.0 %}
  {% set my = (y_lo + y_hi) / 2.0 %}
  # The blade comes down too, ahead of the nozzle: [x0, x1, y0, y1] around
  # the nozzle, 5 mm deep behind its face.
  {% set dir = s.direction|lower %}
  {% set sign = -1 if dir in ["front", "left"] else 1 %}
  {% set a_near = sign * (s.blade_offset - 5.0) %}
  {% set a_far = sign * s.blade_offset %}
  {% set hw = s.blade_width / 2.0 %}
  {% if dir in ["front", "back"] %}
    {% set blade = [-hw, hw, [a_near, a_far]|min, [a_near, a_far]|max] %}
  {% else %}
    {% set blade = [[a_near, a_far]|min, [a_near, a_far]|max, -hw, hw] %}
  {% endif %}
  {% set best = namespace(x=mx, y=my, score=-999999.0, clear=999999.0) %}
  {% for i in range(0, 21) %}
    {% for j in range(0, 21) %}
      {% set px = x_lo + (x_hi - x_lo) * i / 20.0 %}
      {% set py = y_lo + (y_hi - y_lo) * j / 20.0 %}
      {% set nx = px - pb.x %}
      {% set ny = py - pb.y %}
      {% set m = namespace(d=999999.0) %}
      {% for r in st.objects %}
        # probe and nozzle are points, the blade a rectangle
        {% for q in [[px, px, py, py], [nx, nx, ny, ny], [nx + blade[0], nx + blade[1], ny + blade[2], ny + blade[3]]] %}
          {% set dx = [r[1] - q[1], 0.0, q[0] - r[2]]|max %}
          {% set dy = [r[3] - q[3], 0.0, q[2] - r[4]]|max %}
          {% set d = (dx * dx + dy * dy) ** 0.5 %}
          {% if d < m.d %}{% set m.d = d %}{% endif %}
        {% endfor %}
      {% endfor %}
      # prefer spots well clear of parts, then the one nearest the centre
      {% set score = [m.d, 60.0]|min - 0.01 * ((px - mx) ** 2 + (py - my) ** 2) ** 0.5 %}
      {% if score > best.score %}
        {% set best.x = px %}
        {% set best.y = py %}
        {% set best.score = score %}
        {% set best.clear = m.d %}
      {% endif %}
    {% endfor %}
  {% endfor %}
  {% if best.clear < s.home_clearance %}
    {action_raise_error("AUTO_EJECT HOME=1: no spot where the probe, the nozzle and the blade are all at least %.0f mm from every part. Remove the parts by hand." % s.home_clearance)}
  {% endif %}
  {action_respond_info("AUTO_EJECT: homing Z with the probe at X=%.1f Y=%.1f, %.0f mm from the nearest part" % (best.x, best.y, [best.clear, 999.0]|min))}
  G90
  G1 X{"%.3f" % (best.x - pb.x)} Y{"%.3f" % (best.y - pb.y)} F{s.travel_speed}
  M400
  # Pretend the bed is far below, then let the probe find it.
  SET_KINEMATIC_POSITION Z={th.axis_maximum[2] - 5.0}
  {s.home_z_gcode}
  {% if s.home_z_gcode|trim|upper == "PROBE" %}
    _AUTO_EJECT_HOME_Z_SET
  {% else %}
    G90
    G1 Z{[s.min_safe_z, st.height + s.z_hop]|max} F{s.z_speed}
  {% endif %}

[gcode_macro _AUTO_EJECT_HOME_Z_SET]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set st = printer["gcode_macro _AUTO_EJECT_STATE"] %}
  {% set pb = printer["gcode_macro _AUTO_EJECT_PROBE"] %}
  # When the probe triggers the nozzle is z_offset above the bed.
  {% set z_now = pb.z + (printer.toolhead.position[2] - printer.probe.last_z_result) %}
  SET_KINEMATIC_POSITION Z={"%.4f" % z_now}
  G90
  G1 Z{[s.min_safe_z, st.height + s.z_hop]|max} F{s.z_speed}
  {action_respond_info("AUTO_EJECT: Z homed around the parts")}


#####################################################################
# EJECT_PURGE
#####################################################################

[gcode_macro EJECT_PURGE]
description: Purge a tall pellet in front of the parts (the sweep pushes it off). Usage: EJECT_PURGE [X=..] [Y=..]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set th = printer.toolhead %}
  {% set direction = s.direction|lower %}
  {% set ai = 1 if direction in ["front", "back"] else 0 %}
  {% set ci = 1 - ai %}
  {% set sign = -1 if direction in ["front", "left"] else 1 %}
  {% set edge = th.axis_minimum[ai] if sign < 0 else th.axis_maximum[ai] %}

  # default position: centred on the parts, in front of the front-most one
  {% set objs = printer.exclude_object.objects if "exclude_object" in printer else [] %}
  {% set ns = namespace(cmin=999999.0, cmax=-999999.0, dmin=999999.0) %}
  {% for o in objs %}
    {% for p in o.polygon %}
      {% if p[ci] < ns.cmin %}{% set ns.cmin = p[ci] %}{% endif %}
      {% if p[ci] > ns.cmax %}{% set ns.cmax = p[ci] %}{% endif %}
      {% if -sign * p[ai] < ns.dmin %}{% set ns.dmin = -sign * p[ai] %}{% endif %}
    {% endfor %}
  {% endfor %}
  {% if ns.cmax > -999999.0 %}
    {% set c_def = (ns.cmin + ns.cmax) / 2.0 %}
    {% set d_def = [ns.dmin - s.purge_gap, -sign * edge + s.purge_edge_margin]|max %}
  {% else %}
    {% set c_def = (th.axis_minimum[ci] + th.axis_maximum[ci]) / 2.0 %}
    {% set d_def = -sign * edge + s.purge_edge_margin %}
  {% endif %}
  {% set a_def = -sign * d_def %}
  {% set x = params.X|default(a_def if ai == 0 else c_def)|float %}
  {% set y = params.Y|default(a_def if ai == 1 else c_def)|float %}

  # rise speed so the volumetric flow equals purge_flow
  {% set area = 3.14159 * (s.filament_diameter / 2.0) ** 2 %}
  {% set seconds = s.purge_length * area / s.purge_flow %}
  {% set rise_f = (s.purge_height - s.purge_start_z) / seconds * 60.0 %}

  {% set ext = printer.configfile.settings.extruder %}
  {% if printer.extruder.temperature < ext.min_extrude_temp %}
    {action_raise_error("EJECT_PURGE: the nozzle is not hot enough to purge")}
  {% endif %}
  # Klipper limits extrusion per mm of travel; a pellet extrudes a lot while
  # only moving up a few mm, so check the limit before trying.
  {% set needed = s.purge_length / (s.purge_height - s.purge_start_z) * area %}
  {% if ext.max_extrude_cross_section|default(0.64) < needed %}
    {action_raise_error("EJECT_PURGE: [extruder] max_extrude_cross_section must be at least %.1f for this pellet (it is %.2f). Raise it, or make purge_height larger / purge_length smaller." % (needed, ext.max_extrude_cross_section|default(0.64)))}
  {% endif %}
  SAVE_GCODE_STATE NAME=_eject_purge
  G90
  G1 Z{[th.position[2], 5.0]|max} F{s.z_speed}
  G1 X{"%.3f" % x} Y{"%.3f" % y} F{s.travel_speed}
  G1 Z{s.purge_start_z} F{s.z_speed}
  M83
  G1 E{s.purge_length} Z{s.purge_height} F{"%.1f" % rise_f}
  G1 E-{s.purge_retract} F2400
  G1 Z{s.purge_height + 2.0} F{s.z_speed}
  RESTORE_GCODE_STATE NAME=_eject_purge


#####################################################################
# Blade measurement with a nozzle probe (Voron Tap and similar)
#
# A block stands on the bed under the nozzle. A nozzle probe triggers on
# whatever touches first, the nozzle or the blade, and the blade's lower
# edge sits above the nozzle tip. So:
#   top    nozzle on the block                      -> block height
#   front  nozzle steps off the block's front edge  -> edge e0
#   rear   nozzle steps off the block's rear edge   -> edge e1
#   blade  nozzle behind the block, blade on it     -> blade_lift
#   face   blade steps off the block's rear edge    -> blade_offset
# "d" is the distance against the push direction, as in _AUTO_EJECT_RUN.
# A failed step stores its reason in _AUTO_EJECT_CAL.error and every
# later step does nothing.
#####################################################################

[gcode_macro _AUTO_EJECT_CAL]
variable_error: ""
variable_direction: "front"
variable_d_start: 0.0
variable_c_start: 0.0
variable_top: 0.0
variable_travel_z: 0.0
variable_e0: 0.0
variable_e1: 0.0
variable_on: 0.0
variable_off: 0.0
variable_found: False
variable_d_blade: 0.0
variable_blade_z: 0.0
variable_lift: 0.0
variable_offset: 0.0
variable_push_z: 0.0
variable_probes: 0
gcode:

[gcode_macro _AUTO_EJECT_MEASURE]
description: Measure the blade against a block under the nozzle (nozzle probes only). Usage: _AUTO_EJECT_MEASURE [DIRECTION=front] [OFFSET=<rough blade_offset>]
gcode:
  _AUTO_EJECT_PROBE_INFO
  _AUTO_EJECT_CAL_START {rawparams}
  _AUTO_EJECT_CAL_TOP
  _AUTO_EJECT_CAL_RANGE KEY=front
  _AUTO_EJECT_CAL_STEP KEY=front
  _AUTO_EJECT_CAL_STEP KEY=front
  _AUTO_EJECT_CAL_STEP KEY=front
  _AUTO_EJECT_CAL_STEP KEY=front
  _AUTO_EJECT_CAL_STEP KEY=front
  _AUTO_EJECT_CAL_STEP KEY=front
  _AUTO_EJECT_CAL_EDGE KEY=front
  _AUTO_EJECT_CAL_RANGE KEY=rear
  _AUTO_EJECT_CAL_STEP KEY=rear
  _AUTO_EJECT_CAL_STEP KEY=rear
  _AUTO_EJECT_CAL_STEP KEY=rear
  _AUTO_EJECT_CAL_STEP KEY=rear
  _AUTO_EJECT_CAL_STEP KEY=rear
  _AUTO_EJECT_CAL_STEP KEY=rear
  _AUTO_EJECT_CAL_EDGE KEY=rear
  _AUTO_EJECT_CAL_BLADE TRY=-1 {rawparams}
  _AUTO_EJECT_CAL_BLADE TRY=0 {rawparams}
  _AUTO_EJECT_CAL_BLADE TRY=1 {rawparams}
  _AUTO_EJECT_CAL_BLADE TRY=2 {rawparams}
  _AUTO_EJECT_CAL_BLADE TRY=3 {rawparams}
  _AUTO_EJECT_CAL_BLADE TRY=4 {rawparams}
  _AUTO_EJECT_CAL_BLADE TRY=5 {rawparams}
  _AUTO_EJECT_CAL_BLADE_CHECK
  _AUTO_EJECT_CAL_RANGE KEY=face
  _AUTO_EJECT_CAL_STEP KEY=face
  _AUTO_EJECT_CAL_STEP KEY=face
  _AUTO_EJECT_CAL_STEP KEY=face
  _AUTO_EJECT_CAL_STEP KEY=face
  _AUTO_EJECT_CAL_STEP KEY=face
  _AUTO_EJECT_CAL_STEP KEY=face
  _AUTO_EJECT_CAL_EDGE KEY=face
  _AUTO_EJECT_CAL_LIFT
  _AUTO_EJECT_CAL_FINISH

[gcode_macro _AUTO_EJECT_CAL_START]
gcode:
  {% set pb = printer["gcode_macro _AUTO_EJECT_PROBE"] %}
  {% set th = printer.toolhead %}
  {% set dir = params.DIRECTION|default("front")|lower %}
  {% set ai = 1 if dir in ["front", "back"] else 0 %}
  {% set sign = -1 if dir in ["front", "left"] else 1 %}
  {% set err = namespace(v="") %}
  {% if dir not in ["front", "back", "left", "right"] %}
    {% set err.v = "unknown direction " ~ dir %}
  {% elif pb.kind != "contact" or (pb.x * pb.x + pb.y * pb.y) ** 0.5 > 1.0 %}
    {% set err.v = "this needs a probe that touches with the nozzle, such as Voron Tap" %}
  {% elif "xyz" not in th.homed_axes|lower %}
    {% set err.v = "the printer is not homed" %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=error VALUE='"{err.v}"'
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=direction VALUE='"{dir}"'
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=d_start VALUE={(-sign) * th.position[ai]}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=c_start VALUE={th.position[1 - ai]}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=found VALUE=False
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=probes VALUE=0
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=travel_z VALUE=0.0
  {% if err.v == "" %}
    {action_respond_info("AUTO_EJECT: measuring the blade, this takes 2-3 minutes")}
  {% endif %}

# Probe at push distance D (cross position stays where the block is)
[gcode_macro _AUTO_EJECT_CAL_PROBE]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set cal = printer["gcode_macro _AUTO_EJECT_CAL"] %}
  {% set ai = 1 if cal.direction in ["front", "back"] else 0 %}
  {% set sign = -1 if cal.direction in ["front", "left"] else 1 %}
  {% set a = -sign * params.D|float %}
  G90
  {% if cal.travel_z > 0 %}
    G1 Z{cal.travel_z} F{s.z_speed}
  {% endif %}
  {% if ai == 1 %}
    G1 X{"%.3f" % cal.c_start} Y{"%.3f" % a} F{s.travel_speed}
  {% else %}
    G1 X{"%.3f" % a} Y{"%.3f" % cal.c_start} F{s.travel_speed}
  {% endif %}
  {params.CMD|default("PROBE SAMPLES=1")}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=probes VALUE={cal.probes + 1}

[gcode_macro _AUTO_EJECT_CAL_TOP]
gcode:
  {% set cal = printer["gcode_macro _AUTO_EJECT_CAL"] %}
  {% if cal.error == "" %}
    _AUTO_EJECT_CAL_PROBE D={cal.d_start} CMD=PROBE
    _AUTO_EJECT_CAL_TOP_SET
  {% endif %}

[gcode_macro _AUTO_EJECT_CAL_TOP_SET]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set pb = printer["gcode_macro _AUTO_EJECT_PROBE"] %}
  {% set z = printer.probe.last_z_result %}
  {% set h = z - pb.z %}
  {% if h < 5.0 or h > 40.0 %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=error VALUE='"no block found under the nozzle (the probe hit {"%.1f" % h} mm above the bed, expected 5-40 mm)"'
    G1 Z{[z + 10.0, s.min_safe_z]|max} F{s.z_speed}
  {% else %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=top VALUE={z}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=travel_z VALUE={z + 8.0}
    G1 Z{z + 8.0} F{s.z_speed}
  {% endif %}

# Whether the last probe touched: the nozzle on the block (front, rear)
# or the blade on the block (face). The blade sits higher than the nozzle,
# so "blade on the block" triggers at least lift below the block top.
[gcode_macro _AUTO_EJECT_CAL_HIT]
gcode:
  {% set cal = printer["gcode_macro _AUTO_EJECT_CAL"] %}
  {% set pb = printer["gcode_macro _AUTO_EJECT_PROBE"] %}
  {% set z = printer.probe.last_z_result %}
  {% if params.KEY == "face" %}
    {% set hit = z > (pb.z + cal.blade_z) / 2.0 %}
  {% else %}
    {% set hit = z > cal.top - 0.3 %}
  {% endif %}
  {% if params.CHECK|default(0)|int == 1 %}
    {% if hit and params.KEY == "face" %}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=error VALUE='"the blade did not come off the block where expected. Measure again with the block centred under the nozzle"'
    {% elif hit %}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=error VALUE='"no {params.KEY} edge found within 20 mm of the nozzle. Use a block 10-30 mm deep centred under the nozzle, and check the blade lower edge is 1-2 mm above the nozzle tip"'
    {% endif %}
  {% elif hit %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=on VALUE={params.D}
  {% else %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=off VALUE={params.D}
  {% endif %}

# Set up a search between a point that touches ("on") and one that does
# not ("off"), and check the "off" end really is off.
[gcode_macro _AUTO_EJECT_CAL_RANGE]
gcode:
  {% set cal = printer["gcode_macro _AUTO_EJECT_CAL"] %}
  {% set th = printer.toolhead %}
  {% if cal.error == "" %}
    {% set ai = 1 if cal.direction in ["front", "back"] else 0 %}
    {% set sign = -1 if cal.direction in ["front", "left"] else 1 %}
    {% if params.KEY == "front" %}
      {% set on = cal.d_start %}{% set off = cal.d_start - 20.0 %}
    {% elif params.KEY == "rear" %}
      {% set on = cal.d_start %}{% set off = cal.d_start + 20.0 %}
    {% else %}
      {% set on = cal.d_blade %}{% set off = cal.d_blade + (cal.e1 - cal.e0) + 15.0 %}
    {% endif %}
    {% set a = -sign * off %}
    {% if a < th.axis_minimum[ai] or a > th.axis_maximum[ai] %}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=error VALUE='"the block is too close to the edge of the bed, put it nearer the middle"'
    {% else %}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=on VALUE={on}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=off VALUE={off}
      _AUTO_EJECT_CAL_PROBE D={off}
      _AUTO_EJECT_CAL_HIT KEY={params.KEY} D={off} CHECK=1
    {% endif %}
  {% endif %}

# One bisection step
[gcode_macro _AUTO_EJECT_CAL_STEP]
gcode:
  {% set cal = printer["gcode_macro _AUTO_EJECT_CAL"] %}
  {% if cal.error == "" %}
    {% set mid = (cal.on + cal.off) / 2.0 %}
    _AUTO_EJECT_CAL_PROBE D={mid}
    _AUTO_EJECT_CAL_HIT KEY={params.KEY} D={mid}
  {% endif %}

[gcode_macro _AUTO_EJECT_CAL_EDGE]
gcode:
  {% set cal = printer["gcode_macro _AUTO_EJECT_CAL"] %}
  {% if cal.error == "" %}
    {% set edge = (cal.on + cal.off) / 2.0 %}
    {% if params.KEY == "front" %}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=e0 VALUE={edge}
    {% elif params.KEY == "rear" %}
      {% set depth = edge - cal.e0 %}
      {% if depth < 5.0 or depth > 40.0 %}
        SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=error VALUE='"the block measured {"%.1f" % depth} mm deep, expected 5-40 mm. Is the blade lower edge above the nozzle tip?"'
      {% endif %}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=e1 VALUE={edge}
    {% else %}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=offset VALUE={edge - cal.e1}
    {% endif %}
  {% endif %}

# Find a spot behind the block where the blade comes down on it. The
# blade is on the block for any nozzle position in (e0 - t, e1) + offset,
# a window at least as long as the block, so stepping by less than the
# block depth cannot miss it. TRY=-1 starts from the rough blade_offset.
# The nozzle stays 6 mm behind the block so its cone cannot touch it.
[gcode_macro _AUTO_EJECT_CAL_BLADE]
gcode:
  {% set cal = printer["gcode_macro _AUTO_EJECT_CAL"] %}
  {% set th = printer.toolhead %}
  {% if cal.error == "" and not cal.found %}
    {% set ai = 1 if cal.direction in ["front", "back"] else 0 %}
    {% set sign = -1 if cal.direction in ["front", "left"] else 1 %}
    {% set k = params.TRY|int %}
    {% set depth = cal.e1 - cal.e0 %}
    {% if k < 0 %}
      {% set d = [cal.e1 + 6.0, (cal.e0 + cal.e1) / 2.0 + params.OFFSET|default(20)|float]|max %}
    {% else %}
      {% set d = cal.e1 + 6.0 + k * (depth - 2.0) %}
    {% endif %}
    {% set a = -sign * d %}
    {% if a >= th.axis_minimum[ai] and a <= th.axis_maximum[ai] %}
      _AUTO_EJECT_CAL_PROBE D={d}
      _AUTO_EJECT_CAL_BLADE_SET D={d}
    {% endif %}
  {% endif %}

[gcode_macro _AUTO_EJECT_CAL_BLADE_SET]
gcode:
  {% set cal = printer["gcode_macro _AUTO_EJECT_CAL"] %}
  {% set pb = printer["gcode_macro _AUTO_EJECT_PROBE"] %}
  {% set z = printer.probe.last_z_result %}
  {% if z > cal.top - 0.3 %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=error VALUE='"the blade lower edge is not above the nozzle tip. Raise it 1-2 mm above the tip (docs/hardware.md) and measure again"'
  {% elif z > pb.z + 1.0 %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=found VALUE=True
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=d_blade VALUE={params.D}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=blade_z VALUE={z}
  {% endif %}

[gcode_macro _AUTO_EJECT_CAL_BLADE_CHECK]
gcode:
  {% set cal = printer["gcode_macro _AUTO_EJECT_CAL"] %}
  {% if cal.error == "" and not cal.found %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=error VALUE='"the blade never came down on the block. Is it mounted, and does it reach ahead of the nozzle?"'
  {% endif %}

# Blade height, with the blade's flat lower edge (not the chamfer at its
# face) on the block and the probe's full sample count.
[gcode_macro _AUTO_EJECT_CAL_LIFT]
gcode:
  {% set cal = printer["gcode_macro _AUTO_EJECT_CAL"] %}
  {% if cal.error == "" %}
    _AUTO_EJECT_CAL_PROBE D={[(cal.e0 + cal.e1) / 2.0 + cal.offset, cal.e1 + 6.0]|max} CMD=PROBE
    _AUTO_EJECT_CAL_LIFT_SET
  {% endif %}

[gcode_macro _AUTO_EJECT_CAL_LIFT_SET]
gcode:
  {% set cal = printer["gcode_macro _AUTO_EJECT_CAL"] %}
  {% set pb = printer["gcode_macro _AUTO_EJECT_PROBE"] %}
  {% set z = printer.probe.last_z_result %}
  {% if z > cal.top - 0.3 %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=error VALUE='"the blade lower edge is not above the nozzle tip. Raise it 1-2 mm above the tip (docs/hardware.md) and measure again"'
  {% elif z < pb.z + 1.0 %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=error VALUE='"the blade missed the block on the final check. Did the block move?"'
  {% else %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=blade_z VALUE={z}
  {% endif %}

[gcode_macro _AUTO_EJECT_CAL_FINISH]
gcode:
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set cal = printer["gcode_macro _AUTO_EJECT_CAL"] %}
  {% if cal.travel_z > 0 %}
    G90
    G1 Z{cal.travel_z + 10.0} F{s.z_speed}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=travel_z VALUE=0.0
  {% if cal.error == "" %}
    {% set lift = cal.top - cal.blade_z %}
    {% set push_z = [s.blade_clearance - lift, s.push_z_min]|max %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=lift VALUE={"%.3f" % lift}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_CAL VARIABLE=push_z VALUE={"%.2f" % push_z}
    {action_respond_info("AUTO_EJECT: blade lower edge %.2f mm above the nozzle tip, face %.1f mm ahead of the nozzle (%d probes). Push height: nozzle %.2f mm, blade %.2f mm above the bed." % (lift, cal.offset, cal.probes, push_z, push_z + lift))}
  {% else %}
    {action_respond_info("AUTO_EJECT: blade measurement stopped: %s" % cal.error)}
  {% endif %}


#####################################################################
# Saved settings
#
# Values saved by AUTO_EJECT_SETUP live in [save_variables] as
# auto_eject_<setting>. They are applied on top of
# auto_eject_settings.cfg one second after Klipper starts.
#####################################################################

[delayed_gcode _AUTO_EJECT_LOAD]
initial_duration: 1
gcode:
  _AUTO_EJECT_APPLY_SAVED

[gcode_macro _AUTO_EJECT_APPLY_SAVED]
gcode:
  {% if "save_variables" in printer %}
    {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
    {% set saved = printer.save_variables.variables %}
    {% set ov = namespace(data={}) %}
    {% for key in saved %}
      {% if key.startswith("auto_eject_") and saved[key] is not none %}
        {% set name = key[11:] %}
        {% if name in ["objects", "height"] %}
          SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_STATE VARIABLE={name} VALUE='{saved[key]|tojson}'
        {% elif name in s %}
          {% set ov.data = dict(ov.data, **{name: saved[key]}) %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {% if ov.data|length > 0 %}
      SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_OVERRIDES VARIABLE=data VALUE="{ov.data}"
    {% endif %}
  {% endif %}


#####################################################################
# AUTO_EJECT_SETUP - guided setup in Mainsail / Fluidd
#
# Every step is a dialog with buttons. The buttons call
# AUTO_EJECT_SETUP STEP=<name> again, so the wizard is a small state
# machine; values in progress live in _AUTO_EJECT_WIZARD.
# Dialog text must not contain double quotes, '#' or ';'.
#####################################################################

[gcode_macro _AUTO_EJECT_WIZARD]
variable_direction: "front"
variable_steppers: "stepper_x,stepper_y"
variable_push_z: 3.0
variable_a_blade: 0.0
variable_blade_offset: 20.0
variable_blade_width: 80.0
variable_push_current: 0.5
variable_cool_mode: "temperature"
variable_cool_temp: 28
variable_cool_time: 600
variable_blade_lift: "unknown"
variable_mode: "setup"
variable_next_step: ""
variable_next_value: ""
gcode:

# Klipper refuses to run a macro from inside itself, so wizard steps that
# continue on their own hand over through this timer instead.
[delayed_gcode _AUTO_EJECT_SETUP_NEXT]
gcode:
  {% set w = printer["gcode_macro _AUTO_EJECT_WIZARD"] %}
  {% if w.next_value %}
    AUTO_EJECT_SETUP STEP={w.next_step} VALUE={w.next_value}
  {% else %}
    AUTO_EJECT_SETUP STEP={w.next_step}
  {% endif %}

[gcode_macro AUTO_EJECT_SETUP]
description: Guided setup for klipper-auto-eject (opens a dialog in Mainsail/Fluidd)
gcode:
  {% set step = params.STEP|default("start")|lower %}
  {% set value = params.VALUE|default("") %}
  {% set s = dict(dict(printer["gcode_macro _AUTO_EJECT_DEFAULTS"], **printer["gcode_macro _AUTO_EJECT_SETTINGS"]), **printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data) %}
  {% set w = printer["gcode_macro _AUTO_EJECT_WIZARD"] %}
  {% set cfg = printer.configfile.settings %}
  # sections without options, e.g. [exclude_object], only appear in .config
  {% set raw = printer.configfile.config %}
  {% set th = printer.toolhead %}
  {% set ai = 1 if w.direction in ["front", "back"] else 0 %}
  {% set axis = "Y" if ai == 1 else "X" %}
  {% set sign = -1 if w.direction in ["front", "left"] else 1 %}
  {% if "respond" not in raw %}
    {action_raise_error("AUTO_EJECT_SETUP needs a [respond] section in printer.cfg to show its dialogs. Add [respond] and run FIRMWARE_RESTART.")}
  {% endif %}

  {% macro begin(title) -%}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Auto-eject setup - {title}"
  {%- endmacro %}
  {% macro text(t) -%}
  RESPOND TYPE=command MSG="action:prompt_text {t}"
  {%- endmacro %}
  {% macro button(label, gcode, color="primary") -%}
  RESPOND TYPE=command MSG="action:prompt_button {label}|{gcode}|{color}"
  {%- endmacro %}
  {% macro footer(label, gcode, color="secondary") -%}
  RESPOND TYPE=command MSG="action:prompt_footer_button {label}|{gcode}|{color}"
  {%- endmacro %}
  {% macro group_start() -%}
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {%- endmacro %}
  {% macro group_end() -%}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {%- endmacro %}
  {% macro show() -%}
  RESPOND TYPE=command MSG="action:prompt_show"
  {%- endmacro %}
  {% macro wset(var, val) -%}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_WIZARD VARIABLE={var} VALUE={val}
  {%- endmacro %}
  {% macro wset_str(var, val) -%}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_WIZARD VARIABLE={var} VALUE='"{val}"'
  {%- endmacro %}
  {% macro jog_rows(next, axis, sign) -%}
  {group_start()}
  {button("Toward edge 10", "_AUTO_EJECT_JOG AXIS=%s DIST=%.1f NEXT=%s" % (axis, 10 * sign, next), "secondary")}
  {button("1", "_AUTO_EJECT_JOG AXIS=%s DIST=%.1f NEXT=%s" % (axis, 1 * sign, next), "secondary")}
  {button("0.1", "_AUTO_EJECT_JOG AXIS=%s DIST=%.2f NEXT=%s" % (axis, 0.1 * sign, next), "secondary")}
  {group_end()}
  {group_start()}
  {button("Away 10", "_AUTO_EJECT_JOG AXIS=%s DIST=%.1f NEXT=%s" % (axis, -10 * sign, next), "secondary")}
  {button("1", "_AUTO_EJECT_JOG AXIS=%s DIST=%.1f NEXT=%s" % (axis, -1 * sign, next), "secondary")}
  {button("0.1", "_AUTO_EJECT_JOG AXIS=%s DIST=%.2f NEXT=%s" % (axis, -0.1 * sign, next), "secondary")}
  {group_end()}
  {%- endmacro %}
  {% macro goto(step, value="") -%}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_WIZARD VARIABLE=next_step VALUE='"{step}"'
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_WIZARD VARIABLE=next_value VALUE='"{value}"'
  UPDATE_DELAYED_GCODE ID=_AUTO_EJECT_SETUP_NEXT DURATION=0.1
  {%- endmacro %}
  {% macro init(mode) -%}
  {wset_str("mode", mode)}
  {wset_str("direction", s.direction)}
  {wset_str("steppers", s.current_steppers)}
  {wset("push_z", s.push_z)}
  {wset("blade_offset", s.blade_offset)}
  {wset("blade_width", s.blade_width)}
  {wset("blade_lift", s.blade_lift) if s.blade_lift is number else wset_str("blade_lift", "unknown")}
  {wset("push_current", s.push_current)}
  {wset_str("cool_mode", s.cool_mode)}
  {wset("cool_temp", s.cool_temp)}
  {wset("cool_time", s.cool_time)}
  _AUTO_EJECT_PROBE_INFO
  {%- endmacro %}
  {% macro store(vals) -%}
  {% set ov = namespace(data=dict(printer["gcode_macro _AUTO_EJECT_OVERRIDES"].data)) %}
  {% for kv in vals %}
    {% set ov.data = dict(ov.data, **{kv[0]: kv[1]}) %}
    {% if "save_variables" in printer %}
  SAVE_VARIABLE VARIABLE=auto_eject_{kv[0]} VALUE='{kv[1]|tojson}'
    {% endif %}
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_OVERRIDES VARIABLE=data VALUE="{ov.data}"
  {%- endmacro %}
  {% set pb = printer["gcode_macro _AUTO_EJECT_PROBE"] %}
  # Voron Tap and other probes that touch with the nozzle can measure the blade
  {% set nozzle_probe = pb.kind == "contact" and (pb.x * pb.x + pb.y * pb.y) ** 0.5 <= 1.0 %}
  {% set cal = printer["gcode_macro _AUTO_EJECT_CAL"] %}
  {% set cancel_label = "Cancel" %}
  {% set cancel_gcode = "AUTO_EJECT_SETUP STEP=close" %}

  # ------------------------------------------------------------------ start
  {% if step == "start" %}
    {init("setup")}
    {goto("welcome")}

  {% elif step == "calibrate" %}
    {init("calibrate")}
    {goto("cal_prepare")}

  {% elif step == "cal_prepare" %}
    {begin("measure the blade")}
    {% if nozzle_probe %}
      {text("The printer measures the blade height and position itself, by touching a block with the probe.")}
      {text("Clear the bed. The printer homes if needed and moves to the centre of the bed, high enough to put a block under the nozzle.")}
      {button("Bed is clear - move", "AUTO_EJECT_SETUP STEP=goto_center")}
      {footer(cancel_label, cancel_gcode)}
    {% else %}
      {text("Measuring the blade needs a probe that touches with the nozzle, such as Voron Tap. Run AUTO_EJECT_SETUP to measure it by hand.")}
      {footer("Close", cancel_gcode)}
    {% endif %}
    {show()}

  {% elif step == "welcome" %}
    {% set pb = printer["gcode_macro _AUTO_EJECT_PROBE"] %}
    {begin("welcome")}
    {text("5 short steps, about 10 minutes. You need the blade on the toolhead and a small block, such as the 20 mm calibration block from hardware/test.")}
    {% set warn = namespace(list=[]) %}
    {% if "exclude_object" not in raw %}
      {% set warn.list = warn.list + ["MISSING - add [exclude_object] to printer.cfg"] %}
    {% endif %}
    {% if pb.kind == "eddy" and s.verify_probe_gcode|trim|upper == "PROBE" %}
      {% set warn.list = warn.list + ["WARNING - eddy-current probe: leftover parts will not be detected (docs/probes.md)"] %}
    {% elif pb.kind == "none" %}
      {% set warn.list = warn.list + ["NOTE - no probe, the bed will not be checked after pushing"] %}
    {% endif %}
    {% if "save_variables" not in printer %}
      {% set warn.list = warn.list + ["NOTE - no [save_variables], you will get lines to copy into auto_eject_settings.cfg"] %}
    {% endif %}
    {% for line in warn.list %}
      {text(line)}
    {% else %}
      {text("Printer check: all OK.")}
    {% endfor %}
    {button("Start", "AUTO_EJECT_SETUP STEP=direction")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  # -------------------------------------------------------------- direction
  {% elif step == "direction" %}
    {begin("1 of 5 - drop edge")}
    {text("Which bed edge should the parts fall off? Put a box under that edge.")}
    {group_start()}
    {button("Front", "AUTO_EJECT_SETUP STEP=set_direction VALUE=front")}
    {button("Back", "AUTO_EJECT_SETUP STEP=set_direction VALUE=back")}
    {group_end()}
    {group_start()}
    {button("Left", "AUTO_EJECT_SETUP STEP=set_direction VALUE=left")}
    {button("Right", "AUTO_EJECT_SETUP STEP=set_direction VALUE=right")}
    {group_end()}
    {text("Bed slingers: left or right is best.")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "set_direction" %}
    {% set d = value|lower %}
    {% if d not in ["front", "back", "left", "right"] %}
      {action_raise_error("AUTO_EJECT_SETUP: unknown direction '%s'" % value)}
    {% endif %}
    {wset_str("direction", d)}
    {% if cfg.printer.kinematics in ["corexy", "corexz", "hybrid_corexy", "hybrid_corexz", "limited_corexy"] %}
      {wset_str("steppers", "stepper_x,stepper_y")}
    {% else %}
      {% set a = "stepper_y" if d in ["front", "back"] else "stepper_x" %}
      {wset_str("steppers", (a ~ "," ~ a ~ "1") if (a ~ "1") in cfg else a)}
    {% endif %}
    {goto("prepare", "")}

  # ---------------------------------------------------------------- prepare
  {% elif step == "prepare" %}
    {begin("2 of 5 - measure the blade")}
    {text("Clear the bed. The toolhead goes to the middle of the bed.")}
    {button("Bed is clear - move", "AUTO_EJECT_SETUP STEP=goto_center")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "goto_center" %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if "xyz" not in th.homed_axes|lower %}
      G28
    {% endif %}
    G90
    G1 Z20 F600
    G1 X{(th.axis_minimum[0] + th.axis_maximum[0]) / 2.0} Y{(th.axis_minimum[1] + th.axis_maximum[1]) / 2.0} F6000
    {% if nozzle_probe %}
      G1 Z{[50.0, th.axis_maximum[2] - 5.0]|min} F600
      M400
      {goto("auto_intro")}
    {% else %}
      G1 Z5 F600
      M400
      {goto("height")}
    {% endif %}

  # ------------------------------------------------- automatic measurement
  {% elif step == "manual" %}
    RESPOND TYPE=command MSG="action:prompt_end"
    G90
    G1 Z5 F600
    M400
    {goto("height")}

  {% elif step == "auto_intro" %}
    {begin(("2 of 5 - " if w.mode == "setup" else "") ~ "measure the blade")}
    {text("Put the block under the nozzle, with a flat side facing the %s edge." % w.direction)}
    {text("Then press Measure. The probe touches the block about 25 times (2-3 minutes).")}
    {button("Measure", "AUTO_EJECT_SETUP STEP=auto_run")}
    {% if w.mode == "setup" %}
      {button("Measure by hand", "AUTO_EJECT_SETUP STEP=manual", "secondary")}
    {% endif %}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "auto_run" %}
    RESPOND TYPE=command MSG="action:prompt_end"
    _AUTO_EJECT_MEASURE DIRECTION={w.direction} OFFSET={w.blade_offset}
    {goto("auto_result")}

  {% elif step == "auto_result" %}
    {begin(("2 of 5 - " if w.mode == "setup" else "") ~ "measure the blade")}
    {% if cal.error %}
      {text("Could not measure: %s." % cal.error)}
      {button("Try again", "AUTO_EJECT_SETUP STEP=auto_intro")}
      {% if w.mode == "setup" %}
        {button("Measure by hand", "AUTO_EJECT_SETUP STEP=manual", "secondary")}
      {% endif %}
    {% else %}
      {text("Done. The blade is %.1f mm above the nozzle tip and %.0f mm ahead of it. It will push %.1f mm above the bed." % (cal.lift, cal.offset, cal.push_z + cal.lift))}
      {% if cal.push_z + cal.lift > 3.0 %}
        {text("TIP - the blade sits high. Lower it to 1-2 mm above the nozzle tip so it also catches thin parts, then measure again.")}
      {% endif %}
      {button("Next", "AUTO_EJECT_SETUP STEP=auto_use")}
      {button("Measure again", "AUTO_EJECT_SETUP STEP=auto_intro", "secondary")}
    {% endif %}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "auto_use" %}
    {wset("push_z", cal.push_z)}
    {wset("blade_offset", "%.1f" % cal.offset)}
    {wset("blade_lift", cal.lift)}
    {goto("width" if w.mode == "setup" else "cal_save", "")}

  {% elif step == "cal_save" %}
    {% set vals = [["push_z", w.push_z], ["blade_offset", w.blade_offset], ["blade_lift", w.blade_lift]] %}
    {store(vals)}
    {begin("measure the blade")}
    {% if "save_variables" in printer %}
      {text("Saved: push_z %.2f, blade_offset %.1f, blade_lift %s. Remove the block from the bed." % (w.push_z, w.blade_offset, ("%.2f" % w.blade_lift) if w.blade_lift is number else w.blade_lift))}
    {% else %}
      {text("Applied until the next restart. To keep them, copy these values into auto_eject_settings.cfg, then remove the block from the bed:")}
      {% for kv in vals %}
        {text("variable_%s: %s" % (kv[0], kv[1]))}
      {% endfor %}
    {% endif %}
    {footer("Close", cancel_gcode, "primary")}
    {show()}

  # ----------------------------------------------------------------- height
  {% elif step == "height" %}
    {begin("2 of 5 - blade height")}
    {text("Lower the toolhead until the BLADE lower edge is about 2 mm above the bed. Two stacked coins under the blade make a good gauge.")}
    {text("The nozzle must never touch the bed. The toolhead will not go below Z 0.5.")}
    {text("Current Z: %.2f mm" % th.position[2])}
    {group_start()}
    {button("Z +1", "_AUTO_EJECT_JOG AXIS=Z DIST=1 NEXT=height", "secondary")}
    {button("Z +0.1", "_AUTO_EJECT_JOG AXIS=Z DIST=0.1 NEXT=height", "secondary")}
    {button("Z -0.1", "_AUTO_EJECT_JOG AXIS=Z DIST=-0.1 NEXT=height", "secondary")}
    {button("Z -1", "_AUTO_EJECT_JOG AXIS=Z DIST=-1 NEXT=height", "secondary")}
    {group_end()}
    {button("Save this height", "AUTO_EJECT_SETUP STEP=save_height")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "save_height" %}
    {wset("push_z", "%.2f" % th.position[2])}
    {wset_str("blade_lift", "unknown")}
    {goto("offset_intro", "")}

  # ----------------------------------------------------------------- offset
  {% elif step == "offset_intro" %}
    {begin("2 of 5 - blade position")}
    {text("Next the printer measures how far the blade sits in front of the nozzle. No ruler needed.")}
    {text("Place the block on the bed between the toolhead and the %s edge, with a flat side facing the blade." % w.direction)}
    {button("Block is in place", "AUTO_EJECT_SETUP STEP=offset_blade")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "offset_blade" %}
    {begin("2 of 5 - blade position")}
    {text("Move the toolhead toward the block until the BLADE just touches its flat side.")}
    {text("Current %s: %.2f" % (axis, th.position[ai]))}
    {jog_rows("offset_blade", axis, sign)}
    {button("Blade touches the block", "AUTO_EJECT_SETUP STEP=save_blade")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "save_blade" %}
    {wset("a_blade", "%.3f" % th.position[ai])}
    RESPOND TYPE=command MSG="action:prompt_end"
    G90
    G1 Z{[th.position[2] + 40.0, 40.0]|max} F{s.z_speed}
    M400
    {goto("offset_nozzle", "")}

  {% elif step == "offset_nozzle" %}
    {begin("2 of 5 - blade position")}
    {text("The toolhead was raised. Now move it until the NOZZLE TIP is right above the same flat side of the block. Look from the side.")}
    {text("Current %s: %.2f" % (axis, th.position[ai]))}
    {jog_rows("offset_nozzle", axis, sign)}
    {button("Nozzle is above the side", "AUTO_EJECT_SETUP STEP=save_nozzle")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "save_nozzle" %}
    {% set off = (th.position[ai] - w.a_blade) * sign %}
    {% if off < 1.0 or off > 200.0 %}
      {begin("2 of 5 - blade position")}
      {text("That gives a blade offset of %.1f mm, which does not look right. The blade face should be in front of the nozzle, toward the drop edge." % off)}
      {button("Measure again", "AUTO_EJECT_SETUP STEP=offset_intro", "warning")}
      {footer(cancel_label, cancel_gcode)}
      {show()}
    {% else %}
      {wset("blade_offset", "%.1f" % off)}
      {goto("width", "")}
    {% endif %}

  # ------------------------------------------------------------------ width
  {% elif step == "width" %}
    {begin("3 of 5 - blade width")}
    {text("Which blade did you print?")}
    {group_start()}
    {button("60 mm", "AUTO_EJECT_SETUP STEP=pick_width VALUE=60")}
    {button("80 mm", "AUTO_EJECT_SETUP STEP=pick_width VALUE=80")}
    {button("100 mm", "AUTO_EJECT_SETUP STEP=pick_width VALUE=100")}
    {group_end()}
    {text("Another size: %.0f mm" % w.blade_width)}
    {group_start()}
    {button("-10", "AUTO_EJECT_SETUP STEP=set_width VALUE=%.0f" % (w.blade_width - 10), "secondary")}
    {button("+10", "AUTO_EJECT_SETUP STEP=set_width VALUE=%.0f" % (w.blade_width + 10), "secondary")}
    {button("Use %.0f mm" % w.blade_width, "AUTO_EJECT_SETUP STEP=pick_width VALUE=%.0f" % w.blade_width, "secondary")}
    {group_end()}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "set_width" %}
    {wset("blade_width", [[value|float, 10.0]|max, 400.0]|min)}
    {goto("width", "")}

  {% elif step == "pick_width" %}
    {wset("blade_width", [[value|float, 10.0]|max, 400.0]|min)}
    {goto("edge", "")}

  # ------------------------------------------------------------------- edge
  {% elif step == "edge" %}
    {begin("4 of 5 - edge check")}
    {text("Remove the block. The toolhead goes to the %s edge and lowers the blade." % w.direction)}
    {button("Bed is clear - move", "AUTO_EJECT_SETUP STEP=edge_go")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "edge_go" %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set edge = th.axis_minimum[ai] if sign < 0 else th.axis_maximum[ai] %}
    G90
    G1 Z20 F600
    {% if ai == 1 %}
      G1 X{(th.axis_minimum[0] + th.axis_maximum[0]) / 2.0} Y{edge} F3000
    {% else %}
      G1 X{edge} Y{(th.axis_minimum[1] + th.axis_maximum[1]) / 2.0} F3000
    {% endif %}
    G1 Z{w.push_z} F300
    M400
    {goto("edge_check")}

  {% elif step == "edge_check" %}
    {begin("4 of 5 - edge check")}
    {text("Look at the blade from the side. Is it past the edge of the sheet?")}
    {button("Yes, it is past the edge", "AUTO_EJECT_SETUP STEP=current")}
    {button("No", "AUTO_EJECT_SETUP STEP=edge_no", "warning")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "edge_no" %}
    {begin("4 of 5 - edge check")}
    {text("The blade needs to reach further. Lengthen its reach in front of the nozzle (blade_reach in hardware/plow.scad), then run the setup again.")}
    {text("You can continue anyway, but parts may stay on the edge of the bed.")}
    {button("Continue anyway", "AUTO_EJECT_SETUP STEP=current", "warning")}
    {footer("Close", cancel_gcode)}
    {show()}

  # ---------------------------------------------------------------- current
  {% elif step == "current" %}
    # 60 % of the weakest run_current, so a stuck part makes the motor skip
    {% set ns = namespace(min=99.0) %}
    {% for st in w.steppers.split(",") %}
      {% for kind in ["tmc2130", "tmc2208", "tmc2209", "tmc2240", "tmc2660", "tmc5160", "tmc5262"] %}
        {% if (kind ~ " " ~ st|trim) in cfg and cfg[kind ~ " " ~ st|trim].run_current < ns.min %}
          {% set ns.min = cfg[kind ~ " " ~ st|trim].run_current %}
        {% endif %}
      {% endfor %}
    {% endfor %}
    {% if ns.min < 99.0 %}
      {wset("push_current", "%.2f" % (ns.min * 0.6))}
    {% endif %}
    {goto("summary", "")}

  {% elif step == "set_cool" %}
    {% if value == "time" %}
      {wset_str("cool_mode", "time")}
      {wset("cool_time", 600)}
    {% else %}
      {wset_str("cool_mode", "temperature")}
      {wset("cool_temp", value|int)}
    {% endif %}
    {goto("summary", "")}

  # ---------------------------------------------------------------- summary
  {% elif step == "summary" %}
    {begin("5 of 5 - save")}
    {text("Drop edge: %s. Blade: %.0f mm wide, %.0f mm ahead of the nozzle, pushes at Z %.2f." % (w.direction, w.blade_width, w.blade_offset, w.push_z))}
    {text("Start pushing when the bed is below: %s" % (("%d C" % w.cool_temp) if w.cool_mode == "temperature" else "after %d minutes" % (w.cool_time / 60)))}
    {group_start()}
    {button("25 C", "AUTO_EJECT_SETUP STEP=set_cool VALUE=25", "secondary")}
    {button("28 C", "AUTO_EJECT_SETUP STEP=set_cool VALUE=28", "secondary")}
    {button("32 C", "AUTO_EJECT_SETUP STEP=set_cool VALUE=32", "secondary")}
    {button("35 C", "AUTO_EJECT_SETUP STEP=set_cool VALUE=35", "secondary")}
    {group_end()}
    {button("Save", "AUTO_EJECT_SETUP STEP=save")}
    {button("Start over", "AUTO_EJECT_SETUP STEP=direction", "secondary")}
    {footer(cancel_label, cancel_gcode)}
    {show()}

  {% elif step == "save" %}
    {% set vals = [["direction", w.direction], ["current_steppers", w.steppers], ["push_z", w.push_z], ["blade_offset", w.blade_offset], ["blade_width", w.blade_width], ["blade_lift", w.blade_lift], ["push_current", w.push_current], ["cool_mode", w.cool_mode], ["cool_temp", w.cool_temp], ["cool_time", w.cool_time]] %}
    {store(vals)}
    {begin("saved")}
    {% if "save_variables" in printer %}
      {text("Saved.")}
    {% else %}
      {text("Settings applied until the next restart. To keep them, copy these values into auto_eject_settings.cfg (text values in double quotes):")}
      {% for kv in vals %}
        {text("variable_%s: %s" % (kv[0], kv[1]))}
      {% endfor %}
    {% endif %}
    {text("Try it: the dry test traces the path 2 cm above the bed. Nothing is pushed.")}
    {button("Dry test", "AUTO_EJECT_SETUP STEP=dry")}
    {footer("Finish", "AUTO_EJECT_SETUP STEP=done", "primary")}
    {show()}

  {% elif step == "dry" %}
    RESPOND TYPE=command MSG="action:prompt_end"
    AUTO_EJECT DRY=1 STRATEGY=full_width
    {goto("done", "")}

  {% elif step == "done" %}
    {begin("done")}
    {text("Setup complete.")}
    {text("1. After the next print, leave the parts on the bed, run AUTO_EJECT and watch.")}
    {text("2. Then put AUTO_EJECT HEIGHT=[max_layer_z] in the slicer end G-code, before your end macro.")}
    {footer("Close", cancel_gcode, "primary")}
    {show()}

  # ------------------------------------------------------------------ reset
  {% elif step == "reset" %}
    {% if "save_variables" in printer %}
      {% for key in printer.save_variables.variables %}
        {% if key.startswith("auto_eject_") %}
          SAVE_VARIABLE VARIABLE={key} VALUE=None
        {% endif %}
      {% endfor %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_AUTO_EJECT_OVERRIDES VARIABLE=data VALUE="{{}}"
    {action_respond_info("AUTO_EJECT_SETUP: saved values cleared, auto_eject_settings.cfg applies again.")}

  {% elif step == "close" %}
    RESPOND TYPE=command MSG="action:prompt_end"

  {% else %}
    {action_raise_error("AUTO_EJECT_SETUP: unknown STEP '%s'" % step)}
  {% endif %}


[gcode_macro AUTO_EJECT_CALIBRATE]
description: Measure the blade height and position with the probe (Voron Tap and other nozzle probes)
gcode:
  AUTO_EJECT_SETUP STEP=calibrate


[gcode_macro _AUTO_EJECT_JOG]
description: Jog helper for AUTO_EJECT_SETUP
gcode:
  {% set axis = params.AXIS|upper %}
  {% set dist = params.DIST|float %}
  {% set th = printer.toolhead %}
  {% if axis not in ["X", "Y", "Z"] %}
    {action_raise_error("AUTO_EJECT_SETUP: bad axis '%s'" % axis)}
  {% endif %}
  {% if "xyz" not in th.homed_axes|lower %}
    {action_raise_error("AUTO_EJECT_SETUP: printer is not homed")}
  {% endif %}
  {% set i = {"X": 0, "Y": 1, "Z": 2}[axis] %}
  {% set lo = 0.5 if axis == "Z" else th.axis_minimum[i] %}
  {% set target = [[th.position[i] + dist, lo]|max, th.axis_maximum[i]]|min %}
  G90
  G1 {axis}{"%.3f" % target} F{600 if axis == "Z" else 1800}
  M400
  AUTO_EJECT_SETUP STEP={params.NEXT}
